<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progressive Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0c1024;
    --navy-soft:#151a33;
    --bg:#f4f5f8;
    --card:#ffffff;
    --line:#e7e8ee;
    --ink:#12131c;
    --ink-soft:#6b7080;
    --amber:#f6c343;
    --amber-dark:#c9931b;
    --amber-soft:#fdf1d3;
    --green:#189d6f;
    --green-soft:#dcf3ea;
    --blue:#3860c9;
    --blue-soft:#e1e8fb;
    --red:#e0433a;
    --red-soft:#fbe0de;
    --radius:16px;
    --radius-sm:10px;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 10px 24px rgba(16,24,40,0.07);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif; line-height:1.45;
  }
  h1,h2,h3,.display{font-family:'Plus Jakarta Sans', sans-serif; font-weight:800;}
  .accent{color:var(--amber-dark);}

  header{
    background:var(--navy); color:#fff; padding:16px 30px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .logo-mark{
    width:38px; height:38px; border-radius:11px; background:var(--amber);
    display:flex; align-items:center; justify-content:center; color:var(--navy);
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:15px; flex-shrink:0;
  }
  .brand h1{font-size:19px; margin:0; color:#fff; letter-spacing:-0.01em;}
  .brand .tag{display:flex; align-items:center; gap:6px; font-size:11px; color:#9aa0b4; margin-top:2px; text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
  .brand .tag .dot{width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block;}
  .who{display:flex; align-items:center; gap:10px;}
  .who .name{font-size:13px; color:#c7cad6; font-weight:600;}

  select, input, textarea{
    font-family:'Inter', sans-serif; font-size:14px; border-radius:var(--radius-sm); border:1.5px solid var(--line);
    background:var(--card); color:var(--ink); padding:9px 12px;
  }
  button{
    cursor:pointer; border:none; border-radius:var(--radius-sm); font-weight:700; font-family:'Inter',sans-serif;
    font-size:13.5px; padding:9px 16px; transition:transform .1s, opacity .1s;
  }
  button:active{transform:translateY(1px);}
  button.primary, button:not(.secondary):not(.danger):not(.ghost){background:var(--amber); color:var(--navy);}
  button.primary:hover, button:not(.secondary):not(.danger):not(.ghost):hover{opacity:0.92;}
  button.secondary{background:rgba(255,255,255,0.08); color:#fff; border:1.5px solid rgba(255,255,255,0.16);}
  header button.secondary:hover{background:rgba(255,255,255,0.14);}
  button.danger{background:var(--red-soft); color:var(--red);}
  button.ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  button.small{padding:6px 11px; font-size:12px;}
  .modal button.secondary, .login-card button.secondary{background:var(--bg); color:var(--ink); border:1.5px solid var(--line);}

  .stats-strip{
    background:var(--navy-soft); padding:18px 30px; display:grid; grid-template-columns:repeat(5,1fr); gap:8px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .stat{text-align:left; cursor:pointer; transition:background .12s; border-radius:10px; padding:4px 6px; margin:-4px -6px;}
  .stat:hover{background:rgba(255,255,255,0.06);}
  .stat.active-filter{background:rgba(246,195,67,0.14); box-shadow:inset 0 0 0 1.5px var(--amber);}
  .stat .num{font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:26px; color:var(--amber); line-height:1;}
  .stat.overdue .num{color:#ff8a7a;}
  .stat .lbl{font-size:10.5px; color:#9aa0b4; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-top:3px;}

  main{max-width:1200px; margin:0 auto; padding:26px 30px 70px;}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .view-toggle{display:flex; background:var(--card); border:1.5px solid var(--line); border-radius:999px; padding:3px; gap:2px;}
  .view-toggle button{border-radius:999px; background:transparent; color:var(--ink-soft); font-weight:700; font-size:13px; padding:7px 16px;}
  .view-toggle button.active{background:var(--navy); color:#fff;}

  .board{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .col h3{
    font-size:14px; letter-spacing:.02em; color:var(--ink-soft); text-transform:uppercase;
    display:flex; align-items:center; justify-content:space-between; margin:0 0 12px 4px; font-weight:800;
  }
  .col h3 .count{background:var(--line); color:var(--ink); border-radius:20px; padding:1px 9px; font-size:11.5px; font-weight:700;}
  .cards{display:flex; flex-direction:column; gap:10px; min-height:40px;}

  .ticket{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 17px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s, box-shadow .12s;
  }
  .ticket:hover{transform:translateY(-2px); box-shadow:0 4px 22px rgba(16,24,40,0.12);}
  .ticket .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .ticket .title{font-weight:700; font-size:14.5px;}
  .ticket .meta{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .chip{font-size:10.5px; padding:3px 10px; border-radius:999px; font-weight:700; letter-spacing:.01em;}
  .chip.project{background:var(--blue-soft); color:var(--blue);}
  .chip.assignee{background:var(--bg); color:var(--ink); border:1px solid var(--line);}
  .chip.priority-High{background:var(--red-soft); color:var(--red);}
  .chip.priority-Normal{background:var(--amber-soft); color:var(--amber-dark);}
  .chip.priority-Low{background:var(--green-soft); color:var(--green);}
  .due-line{font-size:11.5px; color:var(--ink-soft); margin-top:9px; font-weight:600;}
  .due-line.overdue{color:var(--red); font-weight:800;}

  .ledger{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .ledger th, .ledger td{padding:12px 14px; text-align:left; border-bottom:1px solid var(--line); font-size:13.5px;}
  .ledger th{background:var(--bg); font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em; font-weight:800;}
  .ledger tr:last-child td{border-bottom:none;}
  .ledger tbody tr:hover{background:var(--bg); cursor:pointer;}
  .pill{font-size:10.5px; font-weight:800; padding:4px 11px; border-radius:999px;}
  .pill.Pending{background:var(--amber-soft); color:var(--amber-dark);}
  .pill.In-Progress{background:var(--blue-soft); color:var(--blue);}
  .pill.Done{background:var(--green-soft); color:var(--green);}

  .empty{text-align:center; color:var(--ink-soft); padding:44px 0; font-size:14px; font-weight:600;}

  .slip{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s;}
  .slip:hover{transform:translateY(-2px);}
  .slip .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px;}
  .slip .title{font-weight:700; font-size:15px;}
  .stepper{display:flex; align-items:flex-start; margin:14px 0 10px;}
  .step{display:flex; flex-direction:column; align-items:center; flex:1; position:relative;}
  .step .dot{
    width:26px; height:26px; border-radius:8px; border:2px solid var(--line); background:var(--card); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; z-index:2;
  }
  .step .lbl{font-size:10px; margin-top:6px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.02em; text-align:center; font-weight:700;}
  .step .bar{position:absolute; top:12px; left:-50%; width:100%; height:3px; background:var(--line); z-index:1;}
  .step:first-child .bar{display:none;}
  .step.done .dot{background:var(--green); border-color:var(--green); color:#fff;}
  .step.done .bar{background:var(--green);}
  .step.current .dot{background:var(--amber); border-color:var(--amber); color:var(--navy); box-shadow:0 0 0 5px var(--amber-soft);}
  .step.revision .dot{background:var(--red); border-color:var(--red); color:#fff;}
  .slip-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .slip-sla{margin-top:9px; font-size:12px; font-weight:700; color:var(--ink-soft);}
  .slip-sla.overdue{color:var(--red);}

  .overlay{position:fixed; inset:0; background:rgba(12,16,36,0.55); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--card); border-radius:20px; width:100%; max-width:580px; max-height:88vh; overflow-y:auto; padding:28px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal h2{font-size:22px; margin:0 0 4px;}
  .modal .close{position:absolute; top:18px; right:20px; background:none; border:none; color:var(--ink-soft); font-size:22px; padding:2px 8px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}

  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px;}
  .detail-meta{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 16px;}
  .detail-desc{font-size:14px; color:var(--ink); white-space:pre-wrap; margin-bottom:16px;}

  .comments{border-top:1px solid var(--line); padding-top:16px; margin-top:8px;}
  .comments h4{margin:0 0 10px; font-size:11.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em; font-weight:800;}
  .comment{background:var(--bg); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:13.5px;}
  .comment .cauthor{font-weight:700; font-size:12.5px;}
  .comment .ctime{font-size:10.5px; color:var(--ink-soft); margin-left:6px; font-weight:600;}
  .add-comment{display:flex; gap:8px; margin-top:10px;}
  .add-comment input{flex:1;}

  .name-gate{position:fixed; inset:0; background:var(--navy); display:flex; align-items:center; justify-content:center; z-index:100;
    background-image: radial-gradient(circle at 20% 20%, rgba(246,195,67,0.10), transparent 45%), radial-gradient(circle at 80% 80%, rgba(56,96,201,0.14), transparent 45%);}
  .login-card{background:var(--card); border-radius:22px; padding:36px 34px; width:100%; max-width:380px; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,0.35);}
  .login-card .logo-mark{margin:0 auto 16px; width:48px; height:48px; border-radius:14px; font-size:19px;}
  .login-card h2{font-size:24px; margin:0 0 4px;}
  .login-card .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:22px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--navy); color:#fff; padding:12px 18px; border-radius:12px;
    font-size:13px; font-weight:600; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,0.3); opacity:0; transform:translateY(8px);
    transition:all .25s; pointer-events:none; max-width:320px;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{background:var(--red);}

  @media (max-width:800px){
    .board{grid-template-columns:1fr;}
    .stats-strip{grid-template-columns:repeat(2,1fr);}
    header{padding:14px 16px;}
    main{padding:16px 16px 70px;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="name-gate" id="nameGate">
  <div class="login-card">
    <div class="logo-mark">PB</div>
    <h2>Progressive <span class="accent">Board</span></h2>
    <div class="sub">Team Task &amp; Job Portal</div>
    <select id="gateSelect" style="width:100%; margin-bottom:10px;"></select>
    <input type="password" id="gatePassword" placeholder="Password" style="width:100%; margin-bottom:10px;" onkeydown="if(event.key==='Enter') setIdentity()">
    <div id="gateError" style="color:var(--red); font-size:13px; margin-bottom:10px; display:none;"></div>
    <button id="loginBtn" style="width:100%;" onclick="setIdentity()">Log In →</button>
  </div>
</div>

<header>
  <div class="brand">
    <div class="logo-mark">PB</div>
    <div>
      <h1>Progressive Board</h1>
      <div class="tag"><span class="dot"></span> Live · Progressive International</div>
    </div>
  </div>
  <div class="who">
    <span class="name" id="whoAmI"></span>
    <button class="secondary small" onclick="logout()">Logout</button>
    <button onclick="openNewTaskModal()">+ New Task</button>
  </div>
</header>

<div class="stats-strip">
  <div class="stat" onclick="clickStat('Total')"><div class="num" id="statTotal">0</div><div class="lbl">Total Tasks</div></div>
  <div class="stat" onclick="clickStat('Pending')"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
  <div class="stat" onclick="clickStat('In Progress')"><div class="num" id="statProgress">0</div><div class="lbl">In Progress</div></div>
  <div class="stat" onclick="clickStat('Done')"><div class="num" id="statDone">0</div><div class="lbl">Done</div></div>
  <div class="stat overdue" onclick="clickStat('Overdue')"><div class="num" id="statOverdue">0</div><div class="lbl">Overdue</div></div>
</div>

<main>
  <div class="toolbar">
    <div class="filters">
      <select id="filterAssignee"><option value="">Everyone</option></select>
      <select id="filterProject"><option value="">All Projects</option></select>
      <select id="filterStatus">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Done">Done</option>
      </select>
      <select id="filterStage" style="display:none;">
        <option value="">All Stages</option>
        <option value="Assigned">Assigned to Designer</option>
        <option value="Submitted">Awaiting Approval</option>
        <option value="ChangesRequested">Changes Requested</option>
        <option value="AwaitingJobID">Awaiting Job ID</option>
        <option value="InProduction">In Production</option>
        <option value="Closed">Closed</option>
      </select>
      <input type="text" id="searchBox" placeholder="Search tasks...">
    </div>
    <div class="view-toggle">
      <button id="viewBoardBtn" class="active" onclick="setView('board')">Board</button>
      <button id="viewListBtn" onclick="setView('list')">Ledger</button>
      <button id="viewDesignBtn" onclick="setView('design')">Design Jobs</button>
    </div>
  </div>

  <div id="boardView" class="board"></div>
  <table id="listView" class="ledger" style="display:none;">
    <thead><tr><th>Title</th><th>Project</th><th>Assigned To</th><th>Priority</th><th>Due</th><th>Status</th></tr></thead>
    <tbody id="listBody"></tbody>
  </table>
  <div id="designView" style="display:none;"></div>
</main>

<!-- New Task Modal -->
<div class="overlay" id="newTaskOverlay">
  <div class="modal">
    <button class="close" onclick="closeModal('newTaskOverlay')">&times;</button>
    <h2>New Task</h2>
    <div class="field">
      <label>Type</label>
      <select id="ntType">
        <option value="General">General Task</option>
        <option value="DesignJob">Design Job (artwork → approval → block production)</option>
      </select>
    </div>
    <div class="field"><label>Title</label><input type="text" id="ntTitle" placeholder="e.g. Design Ramzan campaign banner"></div>
    <div class="field"><label>Description</label><textarea id="ntDesc" placeholder="Details, links, references..."></textarea></div>
    <div class="row2">
      <div class="field"><label>Assigned By</label><select id="ntAssignBy"></select></div>
      <div class="field"><label>Assign To</label><select id="ntAssignTo"></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Project / Category</label><input type="text" id="ntProject" placeholder="e.g. Marketing, ZFM, Sales"></div>
      <div class="field"><label>Priority</label><select id="ntPriority"><option>Normal</option><option>High</option><option>Low</option></select></div>
    </div>
    <div class="field"><label>Due Date</label><input type="date" id="ntDueDate"></div>
    <div class="field"><label>Reference link (optional)</label><input type="text" id="ntAttachment" placeholder="Paste a Drive/WhatsApp/image link"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal('newTaskOverlay')">Cancel</button>
      <button id="ntSubmitBtn" onclick="submitNewTask()">Create Task</button>
    </div>
  </div>
</div>

<!-- Task Detail Modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <button class="close" onclick="closeModal('detailOverlay')">&times;</button>
    <div class="detail-head">
      <h2 id="dTitle"></h2>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <button class="ghost small" onclick="toggleEditMode()">Edit</button>
        <button class="danger small" onclick="deleteCurrentTask()">Delete</button>
      </div>
    </div>
    <div id="dViewMode">
      <div class="detail-meta">
        <span class="chip project" id="dProject"></span>
        <span class="chip assignee" id="dPriority"></span>
        <span class="chip assignee" id="dAssignee"></span>
        <span class="due-line" id="dDue"></span>
      </div>
      <div class="detail-desc" id="dDesc"></div>
      <div id="dActionArea"></div>
    </div>
    <div id="dEditForm" style="display:none;">
      <div class="field"><label>Title</label><input type="text" id="edTitle"></div>
      <div class="field"><label>Description</label><textarea id="edDesc"></textarea></div>
      <div class="row2">
        <div class="field"><label>Project</label><input type="text" id="edProject"></div>
        <div class="field"><label>Priority</label><select id="edPriority"><option>Normal</option><option>High</option><option>Low</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Assign To</label><select id="edAssignTo"></select></div>
        <div class="field"><label>Due Date</label><input type="date" id="edDueDate"></div>
      </div>
      <div class="modal-actions">
        <button class="secondary" onclick="cancelEdit()">Cancel</button>
        <button onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
    <div class="comments">
      <h4>Log / Comments</h4>
      <div id="dComments"></div>
      <div class="add-comment">
        <input type="text" id="dNewComment" placeholder="Add a comment...">
        <input type="text" id="dCommentLink" placeholder="link (optional)" style="max-width:150px;">
        <button onclick="submitComment()">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ============ CONFIG ============
  const API_URL = 'https://script.google.com/macros/s/AKfycbwkIoqHjCdEDo0d2q4IV7B81VKtX5tcEJB3QQFD3extPHfbMPedMPH38slKIO7FvekC/exec';

  // ============ STATE ============
  let tasks = [];
  let users = [];
  let currentView = 'board';
  let activeTaskId = null;
  let overdueOnly = false;
  const commentsCache = {};

  // ============ TOAST ============
  let toastTimer = null;
  function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ============ IDENTITY / LOGIN ============
  function initIdentity() {
    const saved = localStorage.getItem('pb_identity');
    if (saved) {
      const user = JSON.parse(saved);
      document.getElementById('nameGate').style.display = 'none';
      document.getElementById('whoAmI').textContent = user.name + (user.designation ? ' · ' + user.designation : '');
    } else {
      document.getElementById('nameGate').style.display = 'flex';
    }
  }
  async function setIdentity() {
    const name = document.getElementById('gateSelect').value;
    const password = document.getElementById('gatePassword').value;
    const errBox = document.getElementById('gateError');
    errBox.style.display = 'none';
    if (!name || !password) { errBox.textContent = 'Naam select karein aur password likhein.'; errBox.style.display = 'block'; return; }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    const slowNotice = setTimeout(() => { btn.textContent = 'Connecting to server...'; }, 3000);

    let res;
    try {
      res = await apiPost({ action: 'login', name, password });
    } catch (err) {
      clearTimeout(slowNotice);
      btn.disabled = false; btn.textContent = 'Log In →';
      errBox.textContent = 'Connection issue — dobara try karein.';
      errBox.style.display = 'block';
      return;
    }
    clearTimeout(slowNotice);
    btn.disabled = false; btn.textContent = 'Log In →';

    if (!res.success) { errBox.textContent = res.error || 'Login fail ho gaya.'; errBox.style.display = 'block'; return; }
    localStorage.setItem('pb_identity', JSON.stringify({ name: res.name, designation: res.designation }));
    document.getElementById('gatePassword').value = '';
    document.getElementById('nameGate').style.display = 'none';
    document.getElementById('whoAmI').textContent = res.name + (res.designation ? ' · ' + res.designation : '');
  }
  function logout() {
    localStorage.removeItem('pb_identity');
    document.getElementById('nameGate').style.display = 'flex';
    document.getElementById('whoAmI').textContent = '';
  }
  function myName() {
    const saved = localStorage.getItem('pb_identity');
    return saved ? JSON.parse(saved).name : '';
  }

  // ============ API HELPERS ============
  async function apiGet(action, params) {
    const q = new URLSearchParams({ action, ...(params || {}) });
    const res = await fetch(API_URL + '?' + q.toString());
    return res.json();
  }
  async function apiPost(payload) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return res.json();
  }
  function bg(promise, failMsg) {
    promise.then(res => { if (res && res.error) showToast(failMsg + ': ' + res.error, true); })
           .catch(() => showToast(failMsg + ' — connection issue, will retry on next sync', true));
  }

  // ============ LOAD DATA ============
  async function loadAll() {
    const [taskRes, userRes] = await Promise.all([apiGet('getTasks'), apiGet('getUsers')]);
    tasks = taskRes.tasks || [];
    users = userRes.users || [];
    populateUserDropdowns();
    populateProjectFilter();
    render();
  }

  function populateUserDropdowns() {
    const gate = document.getElementById('gateSelect');
    const filterA = document.getElementById('filterAssignee');
    const ntAssign = document.getElementById('ntAssignTo');
    const ntAssignBy = document.getElementById('ntAssignBy');
    gate.innerHTML = '<option value="">Select your name...</option>';
    filterA.innerHTML = '<option value="">Everyone</option>';
    ntAssign.innerHTML = '';
    ntAssignBy.innerHTML = '';
    users.forEach(u => {
      gate.innerHTML += `<option value="${u.Name}">${u.Name}</option>`;
      filterA.innerHTML += `<option value="${u.Name}">${u.Name}</option>`;
      ntAssign.innerHTML += `<option value="${u.Name}">${u.Name}</option>`;
      ntAssignBy.innerHTML += `<option value="${u.Name}">${u.Name}</option>`;
    });
    if (myName()) ntAssignBy.value = myName();
  }

  function populateProjectFilter() {
    const filterP = document.getElementById('filterProject');
    const current = filterP.value;
    const projects = [...new Set(tasks.map(t => t.Project).filter(Boolean))];
    filterP.innerHTML = '<option value="">All Projects</option>' + projects.map(p => `<option value="${p}">${p}</option>`).join('');
    filterP.value = current;
  }

  // ============ FILTERING ============
  function getFilteredTasks() {
    const assignee = document.getElementById('filterAssignee').value;
    const project = document.getElementById('filterProject').value;
    const status = document.getElementById('filterStatus').value;
    const stage = document.getElementById('filterStage').value;
    const search = document.getElementById('searchBox').value.toLowerCase();
    return tasks.filter(t => {
      if (assignee && t.AssignedTo !== assignee) return false;
      if (project && t.Project !== project) return false;
      if (status && t.Status !== status) return false;
      if (stage && t.Stage !== stage) return false;
      if (overdueOnly && !isOverdue(t)) return false;
      if (search && !(t.Title || '').toLowerCase().includes(search)) return false;
      return true;
    });
  }

  // Clicking a stat box in the dark strip toggles it as a quick filter.
  function clickStat(kind) {
    const statusSelect = document.getElementById('filterStatus');
    if (kind === 'Total') {
      statusSelect.value = '';
      overdueOnly = false;
    } else if (kind === 'Overdue') {
      overdueOnly = !overdueOnly;
      statusSelect.value = '';
    } else {
      overdueOnly = false;
      statusSelect.value = (statusSelect.value === kind) ? '' : kind;
    }
    updateStatActiveClasses();
    render();
  }

  function updateStatActiveClasses() {
    document.querySelectorAll('.stat').forEach(el => el.classList.remove('active-filter'));
    const statusVal = document.getElementById('filterStatus').value;
    if (overdueOnly) document.getElementById('statOverdue').closest('.stat').classList.add('active-filter');
    else if (statusVal === 'Pending') document.getElementById('statPending').closest('.stat').classList.add('active-filter');
    else if (statusVal === 'In Progress') document.getElementById('statProgress').closest('.stat').classList.add('active-filter');
    else if (statusVal === 'Done') document.getElementById('statDone').closest('.stat').classList.add('active-filter');
  }
  function isOverdue(t) {
    if (t.Status === 'Done') return false;
    const d = new Date(t.DueDate); d.setHours(0,0,0,0);
    const today = new Date(); today.setHours(0,0,0,0);
    return d < today;
  }
  function fmtDate(d) {
    const dt = new Date(d);
    if (isNaN(dt)) return '';
    return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function toDateInputValue(d) {
    const dt = new Date(d);
    if (isNaN(dt)) return '';
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }

  // ============ LOCAL (OPTIMISTIC) STATE HELPERS ============
  function patchLocalTask(id, patch) {
    const idx = tasks.findIndex(t => t.ID === id);
    if (idx > -1) tasks[idx] = { ...tasks[idx], ...patch };
  }
  function removeLocalTask(id) { tasks = tasks.filter(t => t.ID !== id); }
  function addLocalTask(task) { tasks.unshift(task); }

  // ============ RENDER ============
  function render() {
    const filtered = getFilteredTasks();
    renderStats();
    updateStatActiveClasses();
    document.getElementById('boardView').style.display = 'none';
    document.getElementById('listView').style.display = 'none';
    document.getElementById('designView').style.display = 'none';
    if (currentView === 'board') renderBoard(filtered.filter(t => t.TaskType !== 'DesignJob'));
    else if (currentView === 'list') renderList(filtered.filter(t => t.TaskType !== 'DesignJob'));
    else renderDesignView(filtered.filter(t => t.TaskType === 'DesignJob'));
  }

  function renderStats() {
    const general = tasks.filter(t => t.TaskType !== 'DesignJob');
    document.getElementById('statTotal').textContent = general.length;
    document.getElementById('statPending').textContent = general.filter(t => t.Status === 'Pending').length;
    document.getElementById('statProgress').textContent = general.filter(t => t.Status === 'In Progress').length;
    document.getElementById('statDone').textContent = general.filter(t => t.Status === 'Done').length;
    document.getElementById('statOverdue').textContent = general.filter(isOverdue).length;
  }

  function ticketHTML(t) {
    const overdue = isOverdue(t);
    return `
      <div class="ticket" onclick="openDetail('${t.ID}')">
        <div class="top-row"><div class="title">${escapeHtml(t.Title)}</div></div>
        <div class="meta">
          ${t.Project ? `<span class="chip project">${escapeHtml(t.Project)}</span>` : ''}
          <span class="chip priority-${t.Priority}">${t.Priority}</span>
          <span class="chip assignee">${escapeHtml(t.AssignedTo)}</span>
        </div>
        <div class="due-line ${overdue ? 'overdue' : ''}">${overdue ? 'Overdue · ' : 'Due '}${fmtDate(t.DueDate)}</div>
      </div>`;
  }

  function renderBoard(list) {
    const cols = { 'Pending': [], 'In Progress': [], 'Done': [] };
    list.forEach(t => { if (cols[t.Status]) cols[t.Status].push(t); });
    const board = document.getElementById('boardView');
    board.style.display = 'grid';
    board.innerHTML = Object.keys(cols).map(k => `
      <div class="col">
        <h3>${k} <span class="count">${cols[k].length}</span></h3>
        <div class="cards">${cols[k].length ? cols[k].map(ticketHTML).join('') : '<div class="empty">— empty —</div>'}</div>
      </div>`).join('');
  }

  function renderList(list) {
    const table = document.getElementById('listView');
    table.style.display = 'table';
    const body = document.getElementById('listBody');
    if (!list.length) { body.innerHTML = `<tr><td colspan="6" class="empty">No tasks match these filters</td></tr>`; return; }
    body.innerHTML = list.map(t => `
      <tr onclick="openDetail('${t.ID}')">
        <td>${escapeHtml(t.Title)}</td>
        <td>${escapeHtml(t.Project || '—')}</td>
        <td>${escapeHtml(t.AssignedTo)}</td>
        <td>${t.Priority}</td>
        <td class="${isOverdue(t) ? 'overdue' : ''}">${fmtDate(t.DueDate)}</td>
        <td><span class="pill ${t.Status.replace(' ','-')}">${t.Status}</span></td>
      </tr>`).join('');
  }

  // ---- Design Job stepper ----
  const STEPS = ['Design','Approval','Job ID','Production','Closed'];
  function stageNodeIndex(stage) {
    if (stage === 'Assigned' || stage === 'ChangesRequested') return 0;
    if (stage === 'Submitted') return 1;
    if (stage === 'AwaitingJobID') return 2;
    if (stage === 'InProduction') return 3;
    if (stage === 'Closed') return 4;
    return 0;
  }
  const STAGE_LABELS = {
    'Assigned': 'Assigned to Designer', 'Submitted': 'Awaiting Approval', 'ChangesRequested': 'Changes Requested',
    'AwaitingJobID': 'Awaiting Job ID', 'InProduction': 'In Production', 'Closed': 'Closed'
  };
  function stepperHTML(t) {
    const cur = stageNodeIndex(t.Stage);
    const isRevision = t.Stage === 'ChangesRequested';
    return `<div class="stepper">` + STEPS.map((label, i) => {
      let cls = '';
      if (t.Stage === 'Closed') cls = 'done';
      else if (i < cur) cls = 'done';
      else if (i === cur) cls = isRevision ? 'revision' : 'current';
      const mark = cls === 'done' ? '✓' : (cls === 'revision' ? '!' : (i+1));
      return `<div class="step ${cls}"><div class="bar"></div><div class="dot">${mark}</div><div class="lbl">${label}</div></div>`;
    }).join('') + `</div>`;
  }
  function businessHoursSince(dateStr) {
    const start = new Date(dateStr), now = new Date();
    let total = 0, cursor = new Date(start);
    while (cursor < now) {
      const dayEnd = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 1);
      const segEnd = dayEnd < now ? dayEnd : now;
      if (cursor.getDay() !== 0) total += (segEnd - cursor) / 3600000;
      cursor = segEnd;
    }
    return total;
  }
  function designSlaText(t) {
    if (t.Stage === 'AwaitingJobID' && t.ApprovedAt) {
      const hrs = businessHoursSince(t.ApprovedAt);
      return hrs >= 24 ? `<span class="slip-sla overdue">Job ID overdue — ${Math.floor(hrs)}h since approval</span>`
                        : `<span class="slip-sla">Job ID due in ~${Math.max(0, Math.ceil(24 - hrs))}h</span>`;
    }
    if (t.Stage === 'InProduction' && t.JobIDCreatedAt) {
      const hrs = businessHoursSince(t.JobIDCreatedAt);
      return hrs >= 48 ? `<span class="slip-sla overdue">Block overdue — ${Math.floor(hrs)}h since Job ID</span>`
                        : `<span class="slip-sla">Block due in ~${Math.max(0, Math.ceil(48 - hrs))}h</span>`;
    }
    return '';
  }
  function renderDesignView(list) {
    document.getElementById('designView').style.display = 'block';
    const container = document.getElementById('designView');
    if (!list.length) { container.innerHTML = '<div class="empty">Koi Design Job nahi hai in filters ke sath.</div>'; return; }
    container.innerHTML = `<div class="cards">` + list.map(t => `
      <div class="slip" onclick="openDetail('${t.ID}')">
        <div class="top-row">
          <div class="title">${escapeHtml(t.Title)}</div>
          <span class="pill ${t.Stage === 'Closed' ? 'Done' : (t.Stage==='ChangesRequested' ? 'Pending' : 'In-Progress')}">${STAGE_LABELS[t.Stage] || t.Stage}</span>
        </div>
        ${stepperHTML(t)}
        <div class="slip-meta">
          ${t.Project ? `<span class="chip project">${escapeHtml(t.Project)}</span>` : ''}
          <span class="chip assignee">Designer: ${escapeHtml(t.AssignedTo)}</span>
          <span class="chip assignee">Assigner: ${escapeHtml(t.AssignedBy)}</span>
          ${t.JobID ? `<span class="chip assignee">Job ID: ${escapeHtml(t.JobID)}</span>` : ''}
        </div>
        ${designSlaText(t)}
      </div>`).join('') + `</div>`;
  }

  function setView(v) {
    currentView = v;
    document.getElementById('viewBoardBtn').classList.toggle('active', v === 'board');
    document.getElementById('viewListBtn').classList.toggle('active', v === 'list');
    document.getElementById('viewDesignBtn').classList.toggle('active', v === 'design');
    document.getElementById('filterStage').style.display = v === 'design' ? 'inline-block' : 'none';
    render();
  }

  // ============ NEW TASK ============
  function openNewTaskModal() {
    if (!myName()) { document.getElementById('nameGate').style.display = 'flex'; return; }
    document.getElementById('ntType').value = 'General';
    document.getElementById('ntTitle').value = '';
    document.getElementById('ntDesc').value = '';
    document.getElementById('ntProject').value = '';
    document.getElementById('ntPriority').value = 'Normal';
    document.getElementById('ntDueDate').value = '';
    document.getElementById('ntAttachment').value = '';
    if (myName()) document.getElementById('ntAssignBy').value = myName();
    document.getElementById('newTaskOverlay').classList.add('show');
  }

  async function submitNewTask() {
    const title = document.getElementById('ntTitle').value.trim();
    const assignedTo = document.getElementById('ntAssignTo').value;
    const assignedBy = document.getElementById('ntAssignBy').value;
    const dueDate = document.getElementById('ntDueDate').value;
    if (!title || !assignedTo || !assignedBy || !dueDate) { showToast('Title, Assigned By, Assign To, Due Date zaroori hain', true); return; }

    const taskType = document.getElementById('ntType').value;
    const tempId = 'temp-' + Date.now();
    const now = new Date().toISOString();
    const optimisticTask = {
      ID: tempId, Title: title, Description: document.getElementById('ntDesc').value.trim(),
      Project: document.getElementById('ntProject').value.trim(), AssignedBy: assignedBy, AssignedTo: assignedTo,
      Priority: document.getElementById('ntPriority').value, Status: 'Pending', DueDate: dueDate,
      CreatedDate: now, LastUpdated: now, TaskType: taskType, Stage: taskType === 'DesignJob' ? 'Assigned' : '',
      AttachmentURL: document.getElementById('ntAttachment').value.trim(), JobID: '', ApprovedAt: '', JobIDCreatedAt: '', ChallanReceivedAt: ''
    };
    addLocalTask(optimisticTask);
    closeModal('newTaskOverlay');
    render();
    showToast('Task created');

    const payload = { action: 'createTask', taskType, title, description: optimisticTask.Description, project: optimisticTask.Project,
      priority: optimisticTask.Priority, dueDate, assignedTo, assignedBy, attachmentUrl: optimisticTask.AttachmentURL };
    const res = await apiPost(payload);
    if (res.success) { patchLocalTask(tempId, { ID: res.id }); render(); }
    else { removeLocalTask(tempId); render(); showToast('Task creation failed: ' + (res.error || ''), true); }
  }

  // ============ TASK DETAIL ============
  function openDetail(id) {
    activeTaskId = id;
    const t = tasks.find(x => x.ID === id);
    if (!t) return;
    document.getElementById('dEditForm').style.display = 'none';
    document.getElementById('dViewMode').style.display = 'block';
    renderDetailView(t);
    document.getElementById('detailOverlay').classList.add('show');
    if (!commentsCache[id]) loadComments(id); else renderCommentsList(id);
  }

  function renderDetailView(t) {
    document.getElementById('dTitle').textContent = t.Title;
    document.getElementById('dProject').textContent = t.Project || 'No Project';
    document.getElementById('dPriority').textContent = t.Priority;
    document.getElementById('dAssignee').textContent = t.AssignedTo + ' (from ' + t.AssignedBy + ')';
    const overdue = isOverdue(t);
    document.getElementById('dDue').textContent = (overdue ? 'Overdue · ' : 'Due ') + fmtDate(t.DueDate);
    document.getElementById('dDue').className = 'due-line ' + (overdue ? 'overdue' : '');
    document.getElementById('dDesc').textContent = t.Description || 'No description added.';
    const area = document.getElementById('dActionArea');
    if (t.TaskType === 'DesignJob') {
      area.innerHTML = stepperHTML(t) + designActionAreaHTML(t);
    } else {
      const statuses = ['Pending', 'In Progress', 'Done'];
      area.innerHTML = `<div style="display:flex; gap:8px; margin-top:14px;">` + statuses.map(s => `
        <button class="${s === t.Status ? '' : 'secondary'}" style="flex:1; font-size:13px; ${s===t.Status ? '' : 'background:var(--bg); color:var(--ink); border:1.5px solid var(--line);'}" onclick="changeStatus('${t.ID}','${s}')">${s}</button>
      `).join('') + `</div>`;
    }
  }

  function refreshDetailIfOpen(id) {
    if (activeTaskId !== id) return;
    const t = tasks.find(x => x.ID === id);
    if (t) renderDetailView(t);
  }

  function designActionAreaHTML(t) {
    const me = myName();
    const isDesigner = me === t.AssignedTo;
    const isAssigner = me === t.AssignedBy;
    let html = `<div style="margin:14px 0;">
      ${designSlaText(t)}
      ${t.AttachmentURL ? `<div style="margin-top:8px;"><a href="${t.AttachmentURL}" target="_blank">📎 View latest design file / link</a></div>` : ''}
      ${t.JobID ? `<div style="margin-top:6px; font-size:13px;"><b>Job ID:</b> ${escapeHtml(t.JobID)}</div>` : ''}
    </div>`;

    if ((t.Stage === 'Assigned' || t.Stage === 'ChangesRequested') && isDesigner) {
      html += `
        <div class="field"><label>Design file link</label><input type="text" id="dsFile" placeholder="Paste Drive/WhatsApp/image link"></div>
        <div class="field"><label>Note (optional)</label><input type="text" id="dsNote" placeholder="e.g. v2 with logo size fixed"></div>
        <button onclick="doSubmitDesign('${t.ID}')">Submit for Approval</button>`;
    } else if (t.Stage === 'Submitted' && isAssigner) {
      html += `
        <div class="field"><label>Comment (required if requesting changes)</label><input type="text" id="dsApprovalComment" placeholder="Feedback / changes needed"></div>
        <div style="display:flex; gap:8px;">
          <button onclick="doApprove('${t.ID}')">Approve</button>
          <button class="secondary" style="background:var(--bg); color:var(--ink); border:1.5px solid var(--line);" onclick="doRequestChanges('${t.ID}')">Request Changes</button>
        </div>`;
    } else if (t.Stage === 'AwaitingJobID' && isDesigner) {
      html += `
        <div class="field"><label>Job ID (from Block Creation Company)</label><input type="text" id="dsJobId" placeholder="Enter Job ID once received"></div>
        <button onclick="doConfirmJobId('${t.ID}')">Confirm Job ID</button>`;
    } else if (t.Stage === 'InProduction' && isDesigner) {
      html += `<button onclick="doMarkChallan('${t.ID}')">Mark Challan Received (Close Job)</button>`;
    } else if (t.Stage === 'Closed') {
      html += `<div class="empty" style="padding:6px 0;">Job closed.</div>`;
    } else {
      html += `<div class="empty" style="padding:6px 0;">Waiting on ${t.Stage === 'Submitted' ? t.AssignedBy : t.AssignedTo}.</div>`;
    }
    return html;
  }

  async function doSubmitDesign(id) {
    const link = document.getElementById('dsFile').value.trim();
    const note = document.getElementById('dsNote').value.trim();
    patchLocalTask(id, { Stage: 'Submitted', AttachmentURL: link || tasks.find(t=>t.ID===id).AttachmentURL });
    optimisticComment(id, note || 'Design submitted for approval.', link);
    refreshDetailIfOpen(id); render(); showToast('Submitted for approval');
    bg(apiPost({ action: 'submitDesign', id, author: myName(), attachmentUrl: link, comment: note }), 'Submit failed');
  }
  async function doApprove(id) {
    const comment = document.getElementById('dsApprovalComment').value.trim();
    patchLocalTask(id, { Stage: 'AwaitingJobID', ApprovedAt: new Date().toISOString() });
    optimisticComment(id, comment || 'Approved. Sent to Block Creation Company.');
    refreshDetailIfOpen(id); render(); showToast('Approved — Block Company notified');
    bg(apiPost({ action: 'approveDesign', id, author: myName(), comment }), 'Approve failed');
  }
  async function doRequestChanges(id) {
    const comment = document.getElementById('dsApprovalComment').value.trim();
    if (!comment) { showToast('Changes request ke liye comment zaroori hai', true); return; }
    patchLocalTask(id, { Stage: 'ChangesRequested' });
    optimisticComment(id, comment);
    refreshDetailIfOpen(id); render(); showToast('Changes requested');
    bg(apiPost({ action: 'requestChanges', id, author: myName(), comment }), 'Request changes failed');
  }
  async function doConfirmJobId(id) {
    const jobId = document.getElementById('dsJobId').value.trim();
    if (!jobId) { showToast('Job ID likhein', true); return; }
    patchLocalTask(id, { Stage: 'InProduction', JobID: jobId, JobIDCreatedAt: new Date().toISOString() });
    optimisticComment(id, 'Job ID confirmed: ' + jobId);
    refreshDetailIfOpen(id); render(); showToast('Job ID confirmed');
    bg(apiPost({ action: 'confirmJobId', id, author: myName(), jobId }), 'Confirm Job ID failed');
  }
  async function doMarkChallan(id) {
    patchLocalTask(id, { Stage: 'Closed', Status: 'Done', ChallanReceivedAt: new Date().toISOString() });
    optimisticComment(id, 'Challan received — job closed.');
    refreshDetailIfOpen(id); render(); showToast('Job closed');
    bg(apiPost({ action: 'markChallanReceived', id, author: myName() }), 'Close job failed');
  }
  async function changeStatus(id, status) {
    patchLocalTask(id, { Status: status });
    refreshDetailIfOpen(id); render(); showToast('Status: ' + status);
    bg(apiPost({ action: 'updateTask', id, status }), 'Status update failed');
  }

  // ============ EDIT / DELETE ============
  function toggleEditMode() {
    const t = tasks.find(x => x.ID === activeTaskId);
    if (!t) return;
    document.getElementById('edTitle').value = t.Title;
    document.getElementById('edDesc').value = t.Description || '';
    document.getElementById('edProject').value = t.Project || '';
    document.getElementById('edPriority').value = t.Priority;
    document.getElementById('edDueDate').value = toDateInputValue(t.DueDate);
    const sel = document.getElementById('edAssignTo');
    sel.innerHTML = users.map(u => `<option value="${u.Name}" ${u.Name === t.AssignedTo ? 'selected' : ''}>${u.Name}</option>`).join('');
    document.getElementById('dViewMode').style.display = 'none';
    document.getElementById('dEditForm').style.display = 'block';
  }
  function cancelEdit() {
    document.getElementById('dEditForm').style.display = 'none';
    document.getElementById('dViewMode').style.display = 'block';
  }
  async function saveEdit() {
    const title = document.getElementById('edTitle').value.trim();
    const dueDate = document.getElementById('edDueDate').value;
    if (!title || !dueDate) { showToast('Title aur Due Date zaroori hain', true); return; }
    const patch = { Title: title, Description: document.getElementById('edDesc').value.trim(),
      Project: document.getElementById('edProject').value.trim(), Priority: document.getElementById('edPriority').value,
      AssignedTo: document.getElementById('edAssignTo').value, DueDate: dueDate };
    patchLocalTask(activeTaskId, patch);
    cancelEdit(); renderDetailView(tasks.find(t=>t.ID===activeTaskId)); render(); showToast('Saved');
    bg(apiPost({ action: 'updateTask', id: activeTaskId, title: patch.Title, description: patch.Description,
      project: patch.Project, priority: patch.Priority, assignedTo: patch.AssignedTo, dueDate }), 'Save failed');
  }
  async function deleteCurrentTask() {
    if (!confirm('Ye task delete karna hai? Ye undo nahi ho sakta.')) return;
    const id = activeTaskId;
    removeLocalTask(id);
    closeModal('detailOverlay'); render(); showToast('Task deleted');
    bg(apiPost({ action: 'deleteTask', id }), 'Delete failed');
  }

  // ============ COMMENTS ============
  function optimisticComment(taskId, comment, attachmentUrl) {
    if (!commentsCache[taskId]) commentsCache[taskId] = [];
    commentsCache[taskId].push({ Author: myName(), Comment: comment, Timestamp: new Date().toISOString(), AttachmentURL: attachmentUrl || '' });
    renderCommentsList(taskId);
  }
  function renderCommentsList(taskId) {
    if (activeTaskId !== taskId) return;
    const comments = commentsCache[taskId] || [];
    const box = document.getElementById('dComments');
    box.innerHTML = comments.length ? comments.map(c => `
      <div class="comment">
        <span class="cauthor">${escapeHtml(c.Author)}</span><span class="ctime">${fmtDate(c.Timestamp)}</span>
        <div>${escapeHtml(c.Comment)}</div>
        ${c.AttachmentURL ? `<div style="margin-top:4px;"><a href="${c.AttachmentURL}" target="_blank">📎 Link</a></div>` : ''}
      </div>`).join('') : '<div class="empty" style="padding:10px 0;">No comments yet</div>';
  }
  async function loadComments(taskId) {
    const res = await apiGet('getComments', { taskId });
    commentsCache[taskId] = res.comments || [];
    renderCommentsList(taskId);
  }
  async function submitComment() {
    const input = document.getElementById('dNewComment');
    const linkInput = document.getElementById('dCommentLink');
    const text = input.value.trim();
    if (!text) return;
    if (!myName()) { document.getElementById('nameGate').style.display = 'flex'; return; }
    const link = linkInput.value.trim();
    optimisticComment(activeTaskId, text, link);
    input.value = ''; linkInput.value = '';
    bg(apiPost({ action: 'addComment', taskId: activeTaskId, author: myName(), comment: text, attachmentUrl: link }), 'Comment failed to save');
  }

  // ============ MODAL HELPERS ============
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); });
  });

  // ============ FILTER LISTENERS ============
  ['filterAssignee','filterProject','filterStatus','filterStage'].forEach(id => document.getElementById(id).addEventListener('change', render));
  document.getElementById('searchBox').addEventListener('input', render);

  // ============ INIT ============
  initIdentity();
  loadAll();
  setInterval(loadAll, 45000);
</script>

</body>
</html>
