<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progressive Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0c1024;
    --navy-soft:#151a33;
    --bg:#f4f5f8;
    --card:#ffffff;
    --line:#e7e8ee;
    --ink:#12131c;
    --ink-soft:#6b7080;
    --amber:#f6c343;
    --amber-dark:#c9931b;
    --amber-soft:#fdf1d3;
    --green:#189d6f;
    --green-soft:#dcf3ea;
    --blue:#3860c9;
    --blue-soft:#e1e8fb;
    --red:#e0433a;
    --red-soft:#fbe0de;
    --radius:16px;
    --radius-sm:10px;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 10px 24px rgba(16,24,40,0.07);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif; line-height:1.45;
  }
  h1,h2,h3,.display{font-family:'Plus Jakarta Sans', sans-serif; font-weight:800;}
  .accent{color:var(--amber-dark);}

  header{
    background:var(--navy); color:#fff; padding:16px 30px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .logo-mark{
    width:38px; height:38px; border-radius:11px; background:var(--amber);
    display:flex; align-items:center; justify-content:center; color:var(--navy);
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:15px; flex-shrink:0;
  }
  .brand h1{font-size:19px; margin:0; color:#fff; letter-spacing:-0.01em;}
  .brand .tag{display:flex; align-items:center; gap:6px; font-size:11px; color:#9aa0b4; margin-top:2px; text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
  .brand .tag .dot{width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block;}
  .who{display:flex; align-items:center; gap:10px;}
  .who .name{font-size:13px; color:#c7cad6; font-weight:600;}

  select, input, textarea{
    font-family:'Inter', sans-serif; font-size:14px; border-radius:var(--radius-sm); border:1.5px solid var(--line);
    background:var(--card); color:var(--ink); padding:9px 12px;
  }
  button{
    cursor:pointer; border:none; border-radius:var(--radius-sm); font-weight:700; font-family:'Inter',sans-serif;
    font-size:13.5px; padding:9px 16px; transition:transform .1s, opacity .1s;
  }
  button:active{transform:translateY(1px);}
  button.primary, button:not(.secondary):not(.danger):not(.ghost){background:var(--amber); color:var(--navy);}
  button.primary:hover, button:not(.secondary):not(.danger):not(.ghost):hover{opacity:0.92;}
  button.secondary{background:rgba(255,255,255,0.08); color:#fff; border:1.5px solid rgba(255,255,255,0.16);}
  header button.secondary:hover{background:rgba(255,255,255,0.14);}
  button.danger{background:var(--red-soft); color:var(--red);}
  button.ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  button.small{padding:6px 11px; font-size:12px;}
  .modal button.secondary, .login-card button.secondary{background:var(--bg); color:var(--ink); border:1.5px solid var(--line);}

  .stats-strip{
    background:var(--navy-soft); padding:18px 30px; display:grid; grid-template-columns:repeat(5,1fr); gap:8px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }

  /* Boards navigation */
  .boards-bar{
    background:var(--navy); display:flex; gap:8px; padding:10px 30px; overflow-x:auto;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .board-chip{
    flex-shrink:0; padding:7px 15px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer;
    background:rgba(255,255,255,0.07); color:#c7cad6; white-space:nowrap; transition:background .12s;
  }
  .board-chip:hover{background:rgba(255,255,255,0.13);}
  .board-chip.active{background:var(--amber); color:var(--navy);}

  /* Notification bell */
  .activity-panel{
    display:none; position:absolute; top:calc(100% + 10px); right:0; width:340px; max-height:440px; overflow-y:auto;
    background:var(--card); border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,0.3); z-index:60; padding:8px;
  }
  .activity-panel.show{display:block;}
  .activity-panel .ap-head{padding:8px 10px; font-size:11.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
  .activity-item{padding:9px 10px; border-radius:10px; font-size:12.5px; color:var(--ink);}
  .activity-item:hover{background:var(--bg);}
  .activity-item b{font-weight:700;}
  .activity-item .a-detail{color:var(--ink-soft); margin-top:2px;}
  .activity-item .a-time{color:var(--ink-soft); font-size:10.5px; margin-top:3px;}
  #bellBadge{
    background:var(--red); color:#fff; border-radius:999px; font-size:9.5px; font-weight:800;
    padding:1px 5px; position:relative; top:-8px; left:2px;
  }

  /* Drag and drop */
  .col.drag-over{background:rgba(56,96,201,0.06); border-radius:var(--radius);}
  .ticket.dragging{opacity:0.4;}
  .ticket[draggable="true"]{cursor:grab;}
  .ticket[draggable="true"]:active{cursor:grabbing;}

  /* Checklist */
  .checklist{margin:14px 0;}
  .checklist-progress{font-size:11.5px; color:var(--ink-soft); font-weight:700; margin-bottom:8px;}
  .checklist-item{display:flex; align-items:center; gap:8px; padding:6px 0;}
  .checklist-item input[type="checkbox"]{width:16px; height:16px; accent-color:var(--green); flex-shrink:0;}
  .checklist-item .ci-text{flex:1; font-size:13.5px;}
  .checklist-item .ci-text.done{text-decoration:line-through; color:var(--ink-soft);}
  .checklist-item .ci-del{background:none; border:none; color:var(--ink-soft); font-size:16px; padding:0 4px; cursor:pointer;}
  .add-checklist-item{display:flex; gap:8px; margin-top:8px;}
  .add-checklist-item input{flex:1;}
  .stat{text-align:left; cursor:pointer; transition:background .12s; border-radius:10px; padding:4px 6px; margin:-4px -6px;}
  .stat:hover{background:rgba(255,255,255,0.06);}
  .stat.active-filter{background:rgba(246,195,67,0.14); box-shadow:inset 0 0 0 1.5px var(--amber);}
  .stat .num{font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:26px; color:var(--amber); line-height:1;}
  .stat.overdue .num{color:#ff8a7a;}
  .stat .lbl{font-size:10.5px; color:#9aa0b4; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-top:3px;}

  main{max-width:1200px; margin:0 auto; padding:26px 30px 70px;}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .view-toggle{display:flex; background:var(--card); border:1.5px solid var(--line); border-radius:999px; padding:3px; gap:2px;}
  .view-toggle button{border-radius:999px; background:transparent; color:var(--ink-soft); font-weight:700; font-size:13px; padding:7px 16px;}
  .view-toggle button.active{background:var(--navy); color:#fff;}

  .board{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .col h3{
    font-size:14px; letter-spacing:.02em; color:var(--ink-soft); text-transform:uppercase;
    display:flex; align-items:center; justify-content:space-between; margin:0 0 12px 4px; font-weight:800;
  }
  .col h3 .count{background:var(--line); color:var(--ink); border-radius:20px; padding:1px 9px; font-size:11.5px; font-weight:700;}
  .cards{display:flex; flex-direction:column; gap:10px; min-height:40px;}

  .ticket{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 17px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s, box-shadow .12s;
  }
  .ticket:hover{transform:translateY(-2px); box-shadow:0 4px 22px rgba(16,24,40,0.12);}
  .ticket .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .ticket .title{font-weight:700; font-size:14.5px;}
  .ticket .meta{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .chip{font-size:10.5px; padding:3px 10px; border-radius:999px; font-weight:700; letter-spacing:.01em;}
  .chip.project{background:var(--blue-soft); color:var(--blue);}
  .chip.assignee{background:var(--bg); color:var(--ink); border:1px solid var(--line);}
  .chip.priority-High{background:var(--red-soft); color:var(--red);}
  .chip.priority-Normal{background:var(--amber-soft); color:var(--amber-dark);}
  .chip.priority-Low{background:var(--green-soft); color:var(--green);}
  .due-line{font-size:11.5px; color:var(--ink-soft); margin-top:9px; font-weight:600;}
  .due-line.overdue{color:var(--red); font-weight:800;}

  .ledger{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .ledger th, .ledger td{padding:12px 14px; text-align:left; border-bottom:1px solid var(--line); font-size:13.5px;}
  .ledger th{background:var(--bg); font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em; font-weight:800;}
  .ledger tr:last-child td{border-bottom:none;}
  .ledger tbody tr:hover{background:var(--bg); cursor:pointer;}
  .pill{font-size:10.5px; font-weight:800; padding:4px 11px; border-radius:999px;}
  .pill.Pending{background:var(--amber-soft); color:var(--amber-dark);}
  .pill.In-Progress{background:var(--blue-soft); color:var(--blue);}
  .pill.Done{background:var(--green-soft); color:var(--green);}

  .empty{text-align:center; color:var(--ink-soft); padding:44px 0; font-size:14px; font-weight:600;}

  .slip{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s;}
  .slip:hover{transform:translateY(-2px);}
  .slip .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px;}
  .slip .title{font-weight:700; font-size:15px;}
  .stepper{display:flex; align-items:flex-start; margin:14px 0 10px;}
  .step{display:flex; flex-direction:column; align-items:center; flex:1; position:relative;}
  .step .dot{
    width:26px; height:26px; border-radius:8px; border:2px solid var(--line); background:var(--card); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; z-index:2;
  }
  .step .lbl{font-size:10px; margin-top:6px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.02em; text-align:center; font-weight:700;}
  .step .bar{position:absolute; top:12px; left:-50%; width:100%; height:3px; background:var(--line); z-index:1;}
  .step:first-child .bar{display:none;}
  .step.done .dot{background:var(--green); border-color:var(--green); color:#fff;}
  .step.done .bar{background:var(--green);}
  .step.current .dot{background:var(--amber); border-color:var(--amber); color:var(--navy); box-shadow:0 0 0 5px var(--amber-soft);}
  .step.revision .dot{background:var(--red); border-color:var(--red); color:#fff;}
  .slip-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .slip-sla{margin-top:9px; font-size:12px; font-weight:700; color:var(--ink-soft);}
  .slip-sla.overdue{color:var(--red);}

  .overlay{position:fixed; inset:0; background:rgba(12,16,36,0.55); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--card); border-radius:20px; width:100%; max-width:580px; max-height:88vh; overflow-y:auto; padding:28px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal h2{font-size:22px; margin:0 0 4px;}
  .modal .close{position:absolute; top:18px; right:20px; background:none; border:none; color:var(--ink-soft); font-size:22px; padding:2px 8px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}

  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px;}
  .detail-meta{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 16px;}
  .detail-desc{font-size:14px; color:var(--ink); white-space:pre-wrap; margin-bottom:16px;}

  .comments{border-top:1px solid var(--line); padding-top:16px; margin-top:8px;}
  .comments h4{margin:0 0 10px; font-size:11.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em; font-weight:800;}
  .comment{background:var(--bg); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:13.5px;}
  .comment .cauthor{font-weight:700; font-size:12.5px;}
  .comment .ctime{font-size:10.5px; color:var(--ink-soft); margin-left:6px; font-weight:600;}
  .add-comment{display:flex; gap:8px; margin-top:10px;}
  .add-comment input{flex:1;}

  .name-gate{position:fixed; inset:0; background:var(--navy); display:flex; align-items:center; justify-content:center; z-index:100;
    background-image: radial-gradient(circle at 20% 20%, rgba(246,195,67,0.10), transparent 45%), radial-gradient(circle at 80% 80%, rgba(56,96,201,0.14), transparent 45%);}
  .login-card{background:var(--card); border-radius:22px; padding:36px 34px; width:100%; max-width:380px; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,0.35);}
  .login-card .logo-mark{margin:0 auto 16px; width:48px; height:48px; border-radius:14px; font-size:19px;}
  .login-card h2{font-size:24px; margin:0 0 4px;}
  .login-card .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:22px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--navy); color:#fff; padding:12px 18px; border-radius:12px;
    font-size:13px; font-weight:600; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,0.3); opacity:0; transform:translateY(8px);
    transition:all .25s; pointer-events:none; max-width:320px;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{background:var(--red);}

  @media (max-width:800px){
    .board{grid-template-columns:1fr;}
    .stats-strip{grid-template-columns:repeat(2,1fr);}
    header{padding:14px 16px;}
    main{padding:16px 16px 70px;}
    .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="name-gate" id="nameGate">
  <div class="login-card">
    <div class="logo-mark">PB</div>
    <h2>Progressive <span class="accent">Board</span></h2>
    <div class="sub">Team Task &amp; Job Portal</div>
    <select id="gateSelect" style="width:100%; margin-bottom:10px;"></select>
    <input type="password" id="gatePassword" placeholder="Password" style="width:100%; margin-bottom:10px;" onkeydown="if(event.key==='Enter') setIdentity()">
    <div id="gateError" style="color:var(--red); font-size:13px; margin-bottom:10px; display:none;"></div>
    <button id="loginBtn" style="width:100%;" onclick="setIdentity()">Log In →</button>
  </div>
</div>

<header>
  <div class="brand">
    <div class="logo-mark">PB</div>
    <div>
      <h1>Progressive Board</h1>
      <div class="tag"><span class="dot"></span> Live · Progressive International</div>
    </div>
  </div>
  <div class="who">
    <span class="name" id="whoAmI"></span>
    <div style="position:relative;">
      <button class="secondary small" id="bellBtn" onclick="toggleActivityPanel()">🔔 <span id="bellBadge" style="display:none;"></span></button>
      <div id="activityPanel" class="activity-panel"></div>
    </div>
    <button class="secondary small" id="sheetBtn" style="display:none;" onclick="window.open(SHEET_URL, '_blank')">Sheet</button>
    <button class="secondary small" onclick="logout()">Logout</button>
    <button onclick="openNewTaskModal()">+ New Task</button>
  </div>
</header>

<div class="boards-bar" id="boardsBar"></div>

<div class="stats-strip">
  <div class="stat" onclick="clickStat('Total')"><div class="num" id="statTotal">0</div><div class="lbl">Total Tasks</div></div>
  <div class="stat" onclick="clickStat('Pending')"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
  <div class="stat" onclick="clickStat('In Progress')"><div class="num" id="statProgress">0</div><div class="lbl">In Progress</div></div>
  <div class="stat" onclick="clickStat('Done')"><div class="num" id="statDone">0</div><div class="lbl">Done</div></div>
  <div class="stat overdue" onclick="clickStat('Overdue')"><div class="num" id="statOverdue">0</div><div class="lbl">Overdue</div></div>
</div>

<main>
  <div class="toolbar">
    <div class="filters">
      <select id="filterAssignee"><option value="">Everyone</option></select>
      <select id="filterProject"><option value="">All Projects</option></select>
      <select id="filterStatus">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Done">Done</option>
      </select>
      <select id="filterStage" style="display:none;">
        <option value="">All Stages</option>
        <option value="NewRequest">New Request</option>
        <option value="Designing">Designing</option>
        <option value="WaitingForApproval">Waiting for Approval</option>
        <option value="RedesignRequired">Redesign Required</option>
        <option value="WaitingForJobID">Waiting for Job ID</option>
        <option value="JobIDReceived">Job ID Received</option>
        <option value="WaitingForBlock">Waiting for Block</option>
        <option value="BlockReceived">Block Received</option>
        <option value="Completed">Completed</option>
      </select>
      <input type="text" id="filterClient" placeholder="Client..." style="display:none; width:110px;">
      <input type="text" id="filterJobId" placeholder="Job ID..." style="display:none; width:100px;">
      <input type="date" id="filterDateFrom" style="display:none;" title="Due date from">
      <input type="date" id="filterDateTo" style="display:none;" title="Due date to">
      <input type="text" id="searchBox" placeholder="Search tasks...">
    </div>
    <div class="view-toggle">
      <button id="viewBoardBtn" class="active" onclick="setView('board')">Board</button>
      <button id="viewListBtn" onclick="setView('list')">Ledger</button>
      <button id="viewDesignBtn" onclick="setView('design')">Design Portal</button>
    </div>
  </div>

  <div id="boardView" class="board"></div>
  <table id="listView" class="ledger" style="display:none;">
    <thead><tr><th>Title</th><th>Project</th><th>Assigned To</th><th>Priority</th><th>Due</th><th>Status</th></tr></thead>
    <tbody id="listBody"></tbody>
  </table>
  <div id="designView" style="display:none;"></div>
</main>

<!-- New Task Modal -->
<div class="overlay" id="newTaskOverlay">
  <div class="modal">
    <button class="close" onclick="closeModal('newTaskOverlay')">&times;</button>
    <h2>New Task</h2>
    <div class="field">
      <label>Type</label>
      <select id="ntType" onchange="onTaskTypeChange()">
        <option value="General">General Task</option>
        <option value="DesignJob">Design Portal Job</option>
      </select>
    </div>
    <div class="field" id="ntJobTypeField" style="display:none;">
      <label>Job Type</label>
      <select id="ntJobType" onchange="onJobTypeChange()">
        <option value="LogoDesign">Logo Design + Block Manufacturing</option>
        <option value="FactoryBlock">Factory Block Request (existing Job ID)</option>
      </select>
    </div>
    <div class="field" id="ntClientField" style="display:none;">
      <label>Client</label>
      <input type="text" id="ntClient" placeholder="Client name">
    </div>
    <div class="field" id="ntExistingJobIdField" style="display:none;">
      <label>Existing Job ID</label>
      <input type="text" id="ntExistingJobId" placeholder="Job ID already issued by factory">
    </div>
    <div class="field"><label>Title</label><input type="text" id="ntTitle" placeholder="e.g. Design Ramzan campaign banner"></div>
    <div class="field"><label>Description</label><textarea id="ntDesc" placeholder="Details, links, references..."></textarea></div>
    <div class="row2">
      <div class="field"><label>Assigned By</label><select id="ntAssignBy"></select></div>
      <div class="field"><label id="ntAssignToLabel">Assign To</label><select id="ntAssignTo"></select></div>
    </div>
    <div class="row2">
      <div class="field" id="ntProjectField"><label>Project / Category</label><input type="text" id="ntProject" placeholder="e.g. Marketing, ZFM, Sales"></div>
      <div class="field"><label>Priority</label><select id="ntPriority"><option>Normal</option><option>High</option><option>Low</option></select></div>
    </div>
    <div class="field"><label>Due Date</label><input type="date" id="ntDueDate"></div>
    <div class="field"><label>Attach file (image/PDF, optional)</label><input type="file" id="ntFile" accept="image/*,.pdf"><div id="ntFileStatus" style="font-size:12px; color:var(--ink-soft); margin-top:4px;"></div></div>
    <div class="field"><label>Or paste a reference link (optional)</label><input type="text" id="ntAttachment" placeholder="Paste a Drive/WhatsApp/image link"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal('newTaskOverlay')">Cancel</button>
      <button id="ntSubmitBtn" onclick="submitNewTask()">Create Task</button>
    </div>
  </div>
</div>

<!-- Task Detail Modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <button class="close" onclick="closeModal('detailOverlay')">&times;</button>
    <div class="detail-head">
      <div>
        <h2 id="dTitle"></h2>
        <div id="dSubtitle" style="font-size:13px; color:var(--ink-soft); margin-top:2px; display:none;"></div>
      </div>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <button class="ghost small" onclick="toggleEditMode()">Edit</button>
        <button class="danger small" onclick="deleteCurrentTask()">Delete</button>
      </div>
    </div>
    <div id="dViewMode">
      <div class="detail-meta">
        <span class="chip project" id="dProject"></span>
        <span class="chip assignee" id="dPriority"></span>
        <span class="chip assignee" id="dAssignee"></span>
        <span class="due-line" id="dDue"></span>
      </div>
      <div class="detail-desc" id="dDesc"></div>
      <div id="dChecklist" class="checklist"></div>
      <div id="dActionArea"></div>
    </div>
    <div id="dEditForm" style="display:none;">
      <div class="field"><label>Title</label><input type="text" id="edTitle"></div>
      <div class="field"><label>Description</label><textarea id="edDesc"></textarea></div>
      <div class="row2">
        <div class="field"><label>Project</label><input type="text" id="edProject"></div>
        <div class="field"><label>Priority</label><select id="edPriority"><option>Normal</option><option>High</option><option>Low</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Assign To</label><select id="edAssignTo"></select></div>
        <div class="field"><label>Due Date</label><input type="date" id="edDueDate"></div>
      </div>
      <div class="modal-actions">
        <button class="secondary" onclick="cancelEdit()">Cancel</button>
        <button onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
    <div class="comments">
      <h4>Log / Comments</h4>
      <div id="dComments"></div>
      <div class="add-comment">
        <input type="text" id="dNewComment" placeholder="Add a comment...">
        <input type="file" id="dCommentFile" style="max-width:130px; font-size:11px;">
        <button onclick="submitComment()">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ============ CONFIG ============
  const API_URL = 'https://script.google.com/macros/s/AKfycbwkIoqHjCdEDo0d2q4IV7B81VKtX5tcEJB3QQFD3extPHfbMPedMPH38slKIO7FvekC/exec';
  const ADMIN_NAME = 'Osama Junaid'; // must match the Name exactly (case-sensitive) as it appears in the Users tab
  const SHEET_URL = 'PASTE_YOUR_GOOGLE_SHEET_URL_HERE'; // the Google Sheet's share link

  // ============ STATE ============
  let tasks = [];
  let users = [];
  let currentView = 'board';
  let activeTaskId = null;
  let overdueOnly = false;
  const commentsCache = {};

  // ============ TOAST ============
  let toastTimer = null;
  function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // ============ IDENTITY / LOGIN ============
  function initIdentity() {
    const saved = localStorage.getItem('pb_identity');
    if (saved) {
      const user = JSON.parse(saved);
      document.getElementById('nameGate').style.display = 'none';
      document.getElementById('whoAmI').textContent = user.name + (user.designation ? ' · ' + user.designation : '');
      document.getElementById('sheetBtn').style.display = isAdmin(user.name) ? 'inline-block' : 'none';
    } else {
      document.getElementById('nameGate').style.display = 'flex';
    }
  }
  function isAdmin(name) {
    return (name || '').trim().toLowerCase() === ADMIN_NAME.trim().toLowerCase();
  }
  async function setIdentity() {
    const name = document.getElementById('gateSelect').value;
    const password = document.getElementById('gatePassword').value;
    const errBox = document.getElementById('gateError');
    errBox.style.display = 'none';
    if (!name || !password) { errBox.textContent = 'Naam select karein aur password likhein.'; errBox.style.display = 'block'; return; }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    const slowNotice = setTimeout(() => { btn.textContent = 'Connecting to server...'; }, 3000);

    let res;
    try {
      res = await apiPost({ action: 'login', name, password });
    } catch (err) {
      clearTimeout(slowNotice);
      btn.disabled = false; btn.textContent = 'Log In →';
      errBox.textContent = 'Connection issue — dobara try karein.';
      errBox.style.display = 'block';
      return;
    }
    clearTimeout(slowNotice);
    btn.disabled = false; btn.textContent = 'Log In →';

    if (!res.success) { errBox.textContent = res.error || 'Login fail ho gaya.'; errBox.style.display = 'block'; return; }
    localStorage.setItem('pb_identity', JSON.stringify({ name: res.name, designation: res.designation }));
    document.getElementById('gatePassword').value = '';
    document.getElementById('nameGate').style.display = 'none';
    document.getElementById('whoAmI').textContent = res.name + (res.designation ? ' · ' + res.designation : '');
    document.getElementById('sheetBtn').style.display = isAdmin(res.name) ? 'inline-block' : 'none';
    document.getElementById('filterAssignee').value = res.name;
    defaultFilterApplied = true;
    render();
  }
  function logout() {
    localStorage.removeItem('pb_identity');
    document.getElementById('nameGate').style.display = 'flex';
    document.getElementById('whoAmI').textContent = '';
    document.getElementById('sheetBtn').style.display = 'none';
    document.getElementById('filterAssignee').value = '';
    defaultFilterApplied = false;
  }
  function myName() {
    const saved = localStorage.getItem('pb_identity');
    return saved ? JSON.parse(saved).name : '';
  }

  // ============ API HELPERS ============
  async function apiGet(action, params) {
    const q = new URLSearchParams({ action, ...(params || {}) });
    const res = await fetch(API_URL + '?' + q.toString());
    return res.json();
  }
  async function apiPost(payload) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return res.json();
  }
  function bg(promise, failMsg) {
    promise.then(res => { if (res && res.error) showToast(failMsg + ': ' + res.error, true); })
           .catch(() => showToast(failMsg + ' — connection issue, will retry on next sync', true));
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Uploads a <input type=file> selection to Drive via the backend. Returns the
  // file URL, or null if no file was selected. Shows a small status line while working.
  async function uploadAttachment(inputEl, statusEl) {
    const file = inputEl.files[0];
    if (!file) return null;
    if (statusEl) statusEl.textContent = 'Uploading ' + file.name + '...';
    const data = await fileToBase64(file);
    const res = await apiPost({ action: 'uploadFile', data, fileName: file.name, mimeType: file.type });
    if (statusEl) statusEl.textContent = res.success ? ('✓ ' + file.name) : (res.error || 'Upload failed');
    return res.success ? res.url : null;
  }

  // ============ LOAD DATA ============
  let defaultFilterApplied = false;
  async function loadAll() {
    const [taskRes, userRes] = await Promise.all([apiGet('getTasks'), apiGet('getUsers')]);
    tasks = taskRes.tasks || [];
    users = userRes.users || [];
    populateUserDropdowns();
    populateProjectFilter();
    if (!defaultFilterApplied && myName()) {
      document.getElementById('filterAssignee').value = myName();
      defaultFilterApplied = true;
    }
    render();
    loadActivity();
  }

  function populateUserDropdowns() {
    const gate = document.getElementById('gateSelect');
    const filterA = document.getElementById('filterAssignee');
    const ntAssignBy = document.getElementById('ntAssignBy');
    gate.innerHTML = '<option value="">Select your name...</option>';
    filterA.innerHTML = '<option value="">Everyone</option>';
    ntAssignBy.innerHTML = '';
    users.forEach(u => {
      gate.innerHTML += `<option value="${u.Name}">${u.Name}</option>`;
      filterA.innerHTML += `<option value="${u.Name}">${u.Name}</option>`;
      ntAssignBy.innerHTML += `<option value="${u.Name}">${u.Name}</option>`;
    });
    if (myName()) ntAssignBy.value = myName();
    populateAssignToOptions();
  }

  // Populates the "Assign To" dropdown in the New Task modal — restricted to
  // Role="Designer" users when creating a Design Portal job, everyone otherwise.
  function populateAssignToOptions() {
    const ntAssign = document.getElementById('ntAssignTo');
    const isDesignJob = document.getElementById('ntType').value === 'DesignJob';
    const designers = users.filter(u => (u.Role || '').toLowerCase() === 'designer');
    const pool = (isDesignJob && designers.length) ? designers : users;
    const current = ntAssign.value;
    ntAssign.innerHTML = pool.map(u => `<option value="${u.Name}">${u.Name}</option>`).join('');
    if (pool.some(u => u.Name === current)) ntAssign.value = current;
    document.getElementById('ntAssignToLabel').textContent = isDesignJob ? 'Designer' : 'Assign To';
  }

  function onTaskTypeChange() {
    const isDesignJob = document.getElementById('ntType').value === 'DesignJob';
    document.getElementById('ntJobTypeField').style.display = isDesignJob ? 'block' : 'none';
    document.getElementById('ntClientField').style.display = isDesignJob ? 'block' : 'none';
    document.getElementById('ntProjectField').style.display = isDesignJob ? 'none' : 'block';
    populateAssignToOptions();
    if (isDesignJob) onJobTypeChange();
    else document.getElementById('ntExistingJobIdField').style.display = 'none';
  }

  function onJobTypeChange() {
    const isFactoryBlock = document.getElementById('ntJobType').value === 'FactoryBlock';
    document.getElementById('ntExistingJobIdField').style.display = isFactoryBlock ? 'block' : 'none';
  }

  function populateProjectFilter() {
    const filterP = document.getElementById('filterProject');
    const current = filterP.value;
    const projects = [...new Set(tasks.map(t => t.Project).filter(Boolean))];
    filterP.innerHTML = '<option value="">All Projects</option>' + projects.map(p => `<option value="${p}">${p}</option>`).join('');
    filterP.value = current;
  }

  function renderBoardsBar() {
    const bar = document.getElementById('boardsBar');
    const current = document.getElementById('filterProject').value;
    const projects = [...new Set(tasks.map(t => t.Project).filter(Boolean))];
    const chips = [{ label: 'All Boards', value: '' }].concat(projects.map(p => ({ label: p, value: p })));
    bar.innerHTML = chips.map(c => `
      <div class="board-chip ${current === c.value ? 'active' : ''}" onclick="selectBoard('${c.value.replace(/'/g,"\\'")}')">${escapeHtml(c.label)}</div>
    `).join('');
  }

  function selectBoard(project) {
    document.getElementById('filterProject').value = project;
    render();
  }

  // ============ FILTERING ============
  function getFilteredTasks() {
    const assignee = document.getElementById('filterAssignee').value;
    const project = document.getElementById('filterProject').value;
    const status = document.getElementById('filterStatus').value;
    const stage = document.getElementById('filterStage').value;
    const client = document.getElementById('filterClient').value.toLowerCase();
    const jobId = document.getElementById('filterJobId').value.toLowerCase();
    const dateFrom = document.getElementById('filterDateFrom').value;
    const dateTo = document.getElementById('filterDateTo').value;
    const search = document.getElementById('searchBox').value.toLowerCase();
    return tasks.filter(t => {
      if (assignee && t.AssignedTo !== assignee) return false;
      if (project && t.Project !== project) return false;
      if (status && t.Status !== status) return false;
      if (stage && t.Stage !== stage) return false;
      if (client && !(t.Client || '').toLowerCase().includes(client)) return false;
      if (jobId && !(t.JobID || '').toLowerCase().includes(jobId)) return false;
      if (dateFrom && t.DueDate && new Date(t.DueDate) < new Date(dateFrom)) return false;
      if (dateTo && t.DueDate && new Date(t.DueDate) > new Date(dateTo)) return false;
      if (overdueOnly && !isOverdue(t)) return false;
      if (search && !(t.Title || '').toLowerCase().includes(search)) return false;
      return true;
    });
  }

  // Clicking a stat box in the dark strip toggles it as a quick filter.
  function clickStat(kind) {
    const statusSelect = document.getElementById('filterStatus');
    if (kind === 'Total') {
      statusSelect.value = '';
      overdueOnly = false;
    } else if (kind === 'Overdue') {
      overdueOnly = !overdueOnly;
      statusSelect.value = '';
    } else {
      overdueOnly = false;
      statusSelect.value = (statusSelect.value === kind) ? '' : kind;
    }
    updateStatActiveClasses();
    render();
  }

  function updateStatActiveClasses() {
    document.querySelectorAll('.stat').forEach(el => el.classList.remove('active-filter'));
    const statusVal = document.getElementById('filterStatus').value;
    if (overdueOnly) document.getElementById('statOverdue').closest('.stat').classList.add('active-filter');
    else if (statusVal === 'Pending') document.getElementById('statPending').closest('.stat').classList.add('active-filter');
    else if (statusVal === 'In Progress') document.getElementById('statProgress').closest('.stat').classList.add('active-filter');
    else if (statusVal === 'Done') document.getElementById('statDone').closest('.stat').classList.add('active-filter');
  }
  function isOverdue(t) {
    if (t.Status === 'Done') return false;
    const d = new Date(t.DueDate); d.setHours(0,0,0,0);
    const today = new Date(); today.setHours(0,0,0,0);
    return d < today;
  }
  function fmtDate(d) {
    const dt = new Date(d);
    if (isNaN(dt)) return '';
    return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function toDateInputValue(d) {
    const dt = new Date(d);
    if (isNaN(dt)) return '';
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }

  // ============ LOCAL (OPTIMISTIC) STATE HELPERS ============
  function patchLocalTask(id, patch) {
    const idx = tasks.findIndex(t => t.ID === id);
    if (idx > -1) tasks[idx] = { ...tasks[idx], ...patch };
  }
  function removeLocalTask(id) { tasks = tasks.filter(t => t.ID !== id); }
  function addLocalTask(task) { tasks.unshift(task); }

  // ============ RENDER ============
  function render() {
    const filtered = getFilteredTasks();
    renderStats();
    updateStatActiveClasses();
    renderBoardsBar();
    document.getElementById('boardView').style.display = 'none';
    document.getElementById('listView').style.display = 'none';
    document.getElementById('designView').style.display = 'none';
    if (currentView === 'board') renderBoard(filtered.filter(t => t.TaskType !== 'DesignJob'));
    else if (currentView === 'list') renderList(filtered.filter(t => t.TaskType !== 'DesignJob'));
    else renderDesignView(filtered.filter(t => t.TaskType === 'DesignJob'));
  }

  function renderStats() {
    const general = tasks.filter(t => t.TaskType !== 'DesignJob');
    document.getElementById('statTotal').textContent = general.length;
    document.getElementById('statPending').textContent = general.filter(t => t.Status === 'Pending').length;
    document.getElementById('statProgress').textContent = general.filter(t => t.Status === 'In Progress').length;
    document.getElementById('statDone').textContent = general.filter(t => t.Status === 'Done').length;
    document.getElementById('statOverdue').textContent = general.filter(isOverdue).length;
  }

  function ticketHTML(t) {
    const overdue = isOverdue(t);
    return `
      <div class="ticket" draggable="true" ondragstart="onDragStart(event,'${t.ID}')" ondragend="this.classList.remove('dragging')" onclick="openDetail('${t.ID}')">
        <div class="top-row"><div class="title">${escapeHtml(t.Title)}</div></div>
        <div class="meta">
          ${t.Project ? `<span class="chip project">${escapeHtml(t.Project)}</span>` : ''}
          <span class="chip priority-${t.Priority}">${t.Priority}</span>
          <span class="chip assignee">${escapeHtml(t.AssignedTo)}</span>
        </div>
        <div class="due-line ${overdue ? 'overdue' : ''}">${overdue ? 'Overdue · ' : 'Due '}${fmtDate(t.DueDate)}</div>
      </div>`;
  }

  function onDragStart(e, id) {
    e.dataTransfer.setData('text/plain', id);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => e.target.classList.add('dragging'), 0);
  }
  function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
  function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
  function onDropColumn(e, status) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const id = e.dataTransfer.getData('text/plain');
    if (id) changeStatus(id, status);
  }

  function renderBoard(list) {
    const cols = { 'Pending': [], 'In Progress': [], 'Done': [] };
    list.forEach(t => { if (cols[t.Status]) cols[t.Status].push(t); });
    const board = document.getElementById('boardView');
    board.style.display = 'grid';
    board.innerHTML = Object.keys(cols).map(k => `
      <div class="col" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDropColumn(event,'${k}')">
        <h3>${k} <span class="count">${cols[k].length}</span></h3>
        <div class="cards">${cols[k].length ? cols[k].map(ticketHTML).join('') : '<div class="empty">— empty — drop a card here —</div>'}</div>
      </div>`).join('');
  }

  function renderList(list) {
    const table = document.getElementById('listView');
    table.style.display = 'table';
    const body = document.getElementById('listBody');
    if (!list.length) { body.innerHTML = `<tr><td colspan="6" class="empty">No tasks match these filters</td></tr>`; return; }
    body.innerHTML = list.map(t => `
      <tr onclick="openDetail('${t.ID}')">
        <td>${escapeHtml(t.Title)}</td>
        <td>${escapeHtml(t.Project || '—')}</td>
        <td>${escapeHtml(t.AssignedTo)}</td>
        <td>${t.Priority}</td>
        <td class="${isOverdue(t) ? 'overdue' : ''}">${fmtDate(t.DueDate)}</td>
        <td><span class="pill ${t.Status.replace(' ','-')}">${t.Status}</span></td>
      </tr>`).join('');
  }

  // ---- Design Management Portal ----
  const STAGE_LABELS = {
    NewRequest: 'New Request', Designing: 'Designing', WaitingForApproval: 'Waiting for Approval',
    RedesignRequired: 'Redesign Required', WaitingForJobID: 'Waiting for Job ID', JobIDReceived: 'Job ID Received',
    WaitingForBlock: 'Waiting for Block', BlockReceived: 'Block Received', Completed: 'Completed'
  };
  const STAGE_PILL_CLASS = {
    NewRequest: 'Pending', Designing: 'In-Progress', WaitingForApproval: 'In-Progress', RedesignRequired: 'Pending',
    WaitingForJobID: 'In-Progress', JobIDReceived: 'In-Progress', WaitingForBlock: 'In-Progress', BlockReceived: 'In-Progress', Completed: 'Done'
  };
  const PORTAL_TABS = [
    { key: 'Total', label: 'Total Jobs' }, { key: 'NewRequest', label: 'New Requests' },
    { key: 'Designing', label: 'Designing' }, { key: 'WaitingForApproval', label: 'Waiting for Approval' },
    { key: 'RedesignRequired', label: 'Redesign Required' }, { key: 'WaitingForJobID', label: 'Waiting for Job ID' },
    { key: 'JobIDReceived', label: 'Job ID Received' }, { key: 'WaitingForBlock', label: 'Waiting for Block' },
    { key: 'OverdueBlocks', label: 'Overdue Blocks' }, { key: 'BlockReceived', label: 'Block Received' },
    { key: 'Completed', label: 'Completed' }
  ];
  let portalTab = 'Total';

  function businessHoursSince(dateStr) {
    const start = new Date(dateStr), now = new Date();
    let total = 0, cursor = new Date(start);
    while (cursor < now) {
      const dayEnd = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 1);
      const segEnd = dayEnd < now ? dayEnd : now;
      if (cursor.getDay() !== 0) total += (segEnd - cursor) / 3600000;
      cursor = segEnd;
    }
    return total;
  }
  function isOverdueBlock(t) {
    return t.Stage === 'WaitingForBlock' && t.ApprovedAt && businessHoursSince(t.ApprovedAt) >= 48;
  }
  function blockSlaText(t) {
    if (t.Stage !== 'WaitingForBlock' || !t.ApprovedAt) return '';
    const hrs = businessHoursSince(t.ApprovedAt);
    return hrs >= 48
      ? `<span class="slip-sla overdue">Block overdue — ${Math.floor(hrs)}h since approval${t.ReminderCount ? ' · ' + t.ReminderCount + ' reminder(s) sent' : ''}</span>`
      : `<span class="slip-sla">Block due in ~${Math.max(0, Math.ceil(48 - hrs))}h</span>`;
  }
  function needsMyAction(t) {
    const me = myName();
    if (t.Stage === 'Designing' || t.Stage === 'RedesignRequired') return t.AssignedTo === me;
    if (t.Stage === 'WaitingForApproval') return t.AssignedBy === me;
    if (t.Stage === 'WaitingForJobID' || t.Stage === 'JobIDReceived') return t.AssignedTo === me;
    if (t.Stage === 'WaitingForBlock' || t.Stage === 'BlockReceived') return t.AssignedTo === me;
    if (t.Stage === 'NewRequest') return t.AssignedTo === me;
    return false;
  }
  function jobTypeLabel(t) { return t.JobType === 'FactoryBlock' ? 'Factory Block' : 'Logo Design'; }

  function jobCardHTML(t, compact) {
    const overdue = isOverdueBlock(t);
    return `
      <div class="slip" onclick="openDetail('${t.ID}')" style="${compact ? 'padding:14px 16px;' : ''}">
        <div class="top-row">
          <div>
            <div class="title">${escapeHtml(t.Client || t.Title)} ${t.Priority === 'High' ? '🔥' : ''}</div>
            ${t.Client ? `<div style="font-size:12.5px; color:var(--ink-soft); margin-top:2px;">${escapeHtml(t.Title)}</div>` : ''}
          </div>
          <span class="pill ${STAGE_PILL_CLASS[t.Stage] || 'Pending'}">${STAGE_LABELS[t.Stage] || t.Stage}</span>
        </div>
        <div class="slip-meta">
          <span class="chip project">${jobTypeLabel(t)}</span>
          <span class="chip assignee">Designer: ${escapeHtml(t.AssignedTo)}</span>
          <span class="chip assignee">By: ${escapeHtml(t.AssignedBy)}</span>
          ${t.JobID ? `<span class="chip assignee">Job ID: ${escapeHtml(t.JobID)}</span>` : ''}
        </div>
        <div class="due-line ${isOverdue(t) ? 'overdue' : ''}" style="margin-top:8px;">${isOverdue(t) ? 'Overdue · ' : 'Due '}${fmtDate(t.DueDate)}</div>
        ${blockSlaText(t)}
      </div>`;
  }

  function renderDesignView(list) {
    document.getElementById('designView').style.display = 'block';
    const container = document.getElementById('designView');

    const urgent = list.filter(t => t.Priority === 'High' && t.Stage !== 'Completed');
    const reminders = list.filter(isOverdueBlock);
    const today = new Date(); today.setHours(0,0,0,0);
    const todaysWork = list.filter(t => {
      const due = new Date(t.DueDate); due.setHours(0,0,0,0);
      return (due.getTime() === today.getTime() && t.Stage !== 'Completed') || needsMyAction(t);
    });

    const counts = {};
    PORTAL_TABS.forEach(tab => {
      counts[tab.key] = tab.key === 'Total' ? list.length
        : tab.key === 'OverdueBlocks' ? list.filter(isOverdueBlock).length
        : list.filter(t => t.Stage === tab.key).length;
    });

    const shown = portalTab === 'Total' ? list
      : portalTab === 'OverdueBlocks' ? list.filter(isOverdueBlock)
      : list.filter(t => t.Stage === portalTab);

    container.innerHTML = `
      ${urgent.length ? `
        <div style="background:var(--red-soft); border:1.5px solid var(--red); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px;">

  const AUTO_URGENT_NAME_JS = 'Ahsan Rahim';

    document.getElementById('ntDesc').value = '';

  async function submitNewTask() {
    const title = document.getElementById('ntTitle').value.trim();
    const assignedTo = document.getElementById('ntAssignTo').value;
    const assignedBy = document.getElementById('ntAssignBy').value;
    const dueDate = document.getElementById('ntDueDate').value;
    const taskType = document.getElementById('ntType').value;
    const jobType = taskType === 'DesignJob' ? document.getElementById('ntJobType').value : '';
    const client = taskType === 'DesignJob' ? document.getElementById('ntClient').value.trim() : '';
    const existingJobId = (jobType === 'FactoryBlock') ? document.getElementById('ntExistingJobId').value.trim() : '';

    if (!title || !assignedTo || !assignedBy || !dueDate) { showToast('Title, Assigned By, Assign To, Due Date zaroori hain', true); return; }
    if (taskType === 'DesignJob' && !client) { showToast('Client ka naam zaroori hai', true); return; }
    if (jobType === 'FactoryBlock' && !existingJobId) { showToast('Existing Job ID zaroori hai Factory Block Request ke liye', true); return; }

    const btn = document.getElementById('ntSubmitBtn');
    btn.disabled = true; btn.textContent = 'Creating...';
    const uploadedUrl = await uploadAttachment(document.getElementById('ntFile'), document.getElementById('ntFileStatus'));
    const finalAttachment = uploadedUrl || document.getElementById('ntAttachment').value.trim();
    btn.disabled = false; btn.textContent = 'Create Task';

    const isUrgent = myName_isUrgent(assignedBy);
    const priority = isUrgent ? 'High' : document.getElementById('ntPriority').value;
    const tempId = 'temp-' + Date.now();
    const now = new Date().toISOString();
    const optimisticTask = {
      ID: tempId, Title: title, Description: document.getElementById('ntDesc').value.trim(),
      Project: document.getElementById('ntProject').value.trim(), AssignedBy: assignedBy, AssignedTo: assignedTo,
      Priority: priority, Status: 'Pending', DueDate: dueDate,
      CreatedDate: now, LastUpdated: now, TaskType: taskType,
      Stage: taskType === 'DesignJob' ? 'NewRequest' : '',
      AttachmentURL: finalAttachment,
      JobID: existingJobId, ApprovedAt: '', JobIDCreatedAt: '', ChallanReceivedAt: '', Checklist: '[]',
      Client: client, JobType: jobType, ReceivedBy: '', BlockReceivedAt: '', ChallanNumber: '', ReminderCount: 0, LastReminderAt: '', DesigningStartedAt: ''
    };
    addLocalTask(optimisticTask);
    closeModal('newTaskOverlay');
    render();
    showToast(taskType === 'DesignJob' ? 'Job created' : 'Task created');

    const payload = { action: 'createTask', taskType, jobType, client, jobId: existingJobId, title, description: optimisticTask.Description,
      project: optimisticTask.Project, priority: document.getElementById('ntPriority').value, dueDate, assignedTo, assignedBy,
      attachmentUrl: finalAttachment };
    const res = await apiPost(payload);
    if (res.success) { patchLocalTask(tempId, { ID: res.id }); render(); }
    else { removeLocalTask(tempId); render(); showToast('Creation failed: ' + (res.error || ''), true); }
  }

  function myName_isUrgent(assignedByName) {
    return (assignedByName || '').trim().toLowerCase() === 'ahsan rahim';
  }

  // ============ TASK DETAIL ============
  function openDetail(id) {
    activeTaskId = id;
    const t = tasks.find(x => x.ID === id);
    if (!t) return;
    document.getElementById('dEditForm').style.display = 'none';
    document.getElementById('dViewMode').style.display = 'block';
    renderDetailView(t);
    document.getElementById('detailOverlay').classList.add('show');
    if (!commentsCache[id]) loadComments(id); else renderCommentsList(id);
  }

  function renderDetailView(t) {
    const showClientFirst = t.TaskType === 'DesignJob' && t.Client;
    document.getElementById('dTitle').textContent = showClientFirst ? t.Client : t.Title;
    const subtitle = document.getElementById('dSubtitle');
    if (showClientFirst) { subtitle.textContent = t.Title; subtitle.style.display = 'block'; }
    else { subtitle.style.display = 'none'; }
    document.getElementById('dProject').textContent = t.Project || 'No Project';
    document.getElementById('dPriority').textContent = t.Priority;
    document.getElementById('dAssignee').textContent = t.AssignedTo + ' (from ' + t.AssignedBy + ')';
    const overdue = isOverdue(t);
    document.getElementById('dDue').textContent = (overdue ? 'Overdue · ' : 'Due ') + fmtDate(t.DueDate);
    document.getElementById('dDue').className = 'due-line ' + (overdue ? 'overdue' : '');
    document.getElementById('dDesc').textContent = t.Description || 'No description added.';
    renderChecklist(t);
    const area = document.getElementById('dActionArea');
    if (t.TaskType === 'DesignJob') {
      area.innerHTML = portalActionAreaHTML(t);
    } else {
      const statuses = ['Pending', 'In Progress', 'Done'];
      area.innerHTML = `<div style="display:flex; gap:8px; margin-top:14px;">` + statuses.map(s => `
        <button class="${s === t.Status ? '' : 'secondary'}" style="flex:1; font-size:13px; ${s===t.Status ? '' : 'background:var(--bg); color:var(--ink); border:1.5px solid var(--line);'}" onclick="changeStatus('${t.ID}','${s}')">${s}</button>
      `).join('') + `</div>`;
    }
  }

  function refreshDetailIfOpen(id) {
    if (activeTaskId !== id) return;
    const t = tasks.find(x => x.ID === id);
    if (t) renderDetailView(t);
  }

  function portalActionAreaHTML(t) {
    const me = myName();
    const isDesigner = me === t.AssignedTo;
    const isRequester = me === t.AssignedBy;
    let html = `<div style="margin:14px 0;">
      <span class="chip project">${jobTypeLabel(t)}</span>
      ${t.Client ? `<span class="chip assignee">Client: ${escapeHtml(t.Client)}</span>` : ''}
      ${blockSlaText(t)}
      ${t.AttachmentURL ? `<div style="margin-top:8px;"><a href="${t.AttachmentURL}" target="_blank">📎 View latest design file / link</a></div>` : ''}
      ${t.JobID ? `<div style="margin-top:6px; font-size:13px;"><b>Job ID:</b> ${escapeHtml(t.JobID)}</div>` : ''}
      ${t.ReceivedBy ? `<div style="margin-top:4px; font-size:13px;"><b>Block received by:</b> ${escapeHtml(t.ReceivedBy)} (${fmtDate(t.BlockReceivedAt)})</div>` : ''}
      ${t.ChallanNumber ? `<div style="margin-top:4px; font-size:13px;"><b>Challan #:</b> ${escapeHtml(t.ChallanNumber)}</div>` : ''}
    </div>`;

    if (t.Stage === 'NewRequest' && t.JobType === 'LogoDesign' && isDesigner) {
      html += `<button onclick="doStartDesigning('${t.ID}')">Start Designing</button>`;
    } else if (t.Stage === 'NewRequest' && t.JobType === 'FactoryBlock' && isDesigner) {
      html += `<button onclick="doSendProductionApproval('${t.ID}')">Send Production Approval Email</button>`;
    } else if ((t.Stage === 'Designing' || t.Stage === 'RedesignRequired') && isDesigner) {
      html += `
        <div class="field"><label>Attach design file (image/PDF)</label><input type="file" id="dsFile" accept="image/*,.pdf"><div id="dsFileStatus" style="font-size:12px; color:var(--ink-soft); margin-top:4px;"></div></div>
        <div class="field"><label>Or paste a link instead (optional)</label><input type="text" id="dsFileLink" placeholder="Paste Drive/WhatsApp/image link"></div>
        <div class="field"><label>Note (optional)</label><input type="text" id="dsNote" placeholder="e.g. v2 with logo size fixed"></div>
        <button onclick="doSubmitForApproval('${t.ID}')">Submit for Approval</button>`;
    } else if (t.Stage === 'WaitingForApproval' && isRequester) {
      html += `
        <div class="field"><label>Comment (required if rejecting)</label><input type="text" id="dsApprovalComment" placeholder="Feedback / rejection reason"></div>
        <div style="display:flex; gap:8px;">
          <button onclick="doApproveArtwork('${t.ID}')">Approve</button>
          <button class="secondary" style="background:var(--bg); color:var(--ink); border:1.5px solid var(--line);" onclick="doRejectArtwork('${t.ID}')">Reject — Redesign Required</button>
        </div>`;
    } else if (t.Stage === 'WaitingForJobID' && isDesigner) {
      html += `
        <div class="field"><label>Job ID (factory reply)</label><input type="text" id="dsJobId" placeholder="Enter Job ID once received"></div>
        <button onclick="doReceiveJobId('${t.ID}')">Save Job ID</button>`;
    } else if (t.Stage === 'JobIDReceived' && isDesigner) {
      html += `<button onclick="doSendProductionApproval('${t.ID}')">Send Production Approval Email</button>`;
    } else if (t.Stage === 'WaitingForBlock' && isDesigner) {
      html += `
        ${isOverdueBlock(t) ? `<button class="secondary" style="background:var(--amber-soft); color:var(--amber-dark); border:1.5px solid var(--amber); margin-bottom:10px;" onclick="quickSendReminder('${t.ID}')">Send Reminder (#${(t.ReminderCount||0)+1})</button>` : ''}
        <div class="field"><label>Received by</label><input type="text" id="dsReceivedBy" placeholder="Name of person who received the block" value="${escapeHtml(me)}"></div>
        <button onclick="doMarkBlockReceived('${t.ID}')">Mark Block Received</button>`;
    } else if (t.Stage === 'BlockReceived' && isDesigner) {
      html += `
        <div class="field"><label>Challan number</label><input type="text" id="dsChallanNumber" placeholder="Challan #"></div>
        <div class="field"><label>Attach challan file (image/PDF)</label><input type="file" id="dsChallanFile" accept="image/*,.pdf"><div id="dsChallanFileStatus" style="font-size:12px; color:var(--ink-soft); margin-top:4px;"></div></div>
        <div class="field"><label>Or paste a link instead (optional)</label><input type="text" id="dsChallanLink" placeholder="Paste WhatsApp/Drive link"></div>
        <button onclick="doUploadChallan('${t.ID}')">Upload Challan &amp; Complete</button>`;
    } else if (t.Stage === 'Completed') {
      html += `<div class="empty" style="padding:6px 0;">Job completed.</div>`;
    } else {
      const waitingOn = (t.Stage === 'WaitingForApproval') ? t.AssignedBy : t.AssignedTo;
      html += `<div class="empty" style="padding:6px 0;">Waiting on ${escapeHtml(waitingOn)}.</div>`;
    }
    return html;
  }

    const link = uploadedUrl || document.getElementById('dsFileLink').value.trim();
    const note = document.getElementById('dsNote').value.trim();

    patchLocalTask(id, { Stage: 'WaitingForJobID' });
    optimisticComment(id, comment || 'Approved. Artwork sent to factory.');
    refreshDetailIfOpen(id); render(); showToast('Approved — artwork emailed to factory');
    bg(apiPost({ action: 'approveArtwork', id, author: myName(), comment }), 'Approve failed');

    optimisticComment(id, comment);
    refreshDetailIfOpen(id); render(); showToast('Redesign required');
    bg(apiPost({ action: 'rejectArtwork', id, author: myName(), comment }), 'Reject failed');

    optimisticComment(id, 'Job ID received: ' + jobId);
    refreshDetailIfOpen(id); render(); showToast('Job ID saved');
    bg(apiPost({ action: 'receiveJobId', id, author: myName(), jobId }), 'Save Job ID failed');

    optimisticComment(id, 'Production approval email sent.');
    refreshDetailIfOpen(id); render(); showToast('Production approval sent');
    bg(apiPost({ action: 'sendProductionApproval', id, author: myName() }), 'Send approval failed');
  }

    if (!receivedBy) { showToast('Receiver ka naam likhein', true); return; }

    optimisticComment(id, 'Block received by ' + receivedBy);
    refreshDetailIfOpen(id); render(); showToast('Block marked received');

  async function doUploadChallan(id) {

    refreshDetailIfOpen(id); render(); showToast('Job completed');

    refreshDetailIfOpen(id); render(); showToast('Status: ' + status);

  // ============ EDIT / DELETE ============
  function toggleEditMode() {
    const t = tasks.find(x => x.ID === activeTaskId);
    if (!t) return;
    document.getElementById('edTitle').value = t.Title;
    document.getElementById('edDesc').value = t.Description || '';
    document.getElementById('edProject').value = t.Project || '';
    document.getElementById('edPriority').value = t.Priority;
    document.getElementById('edDueDate').value = toDateInputValue(t.DueDate);
    const sel = document.getElementById('edAssignTo');
    sel.innerHTML = users.map(u => `<option value="${u.Name}" ${u.Name === t.AssignedTo ? 'selected' : ''}>${u.Name}</option>`).join('');

    document.getElementById('dEditForm').style.display = 'block';

  function cancelEdit() {
    document.getElementById('dEditForm').style.display = 'none';
    document.getElementById('dViewMode').style.display = 'block';
  }
  async function saveEdit() {
    const title = document.getElementById('edTitle').value.trim();
    const dueDate = document.getElementById('edDueDate').value;
    if (!title || !dueDate) { showToast('Title aur Due Date zaroori hain', true); return; }
    const patch = { Title: title, Description: document.getElementById('edDesc').value.trim(),
      Project: document.getElementById('edProject').value.trim(), Priority: document.getElementById('edPriority').value,
      AssignedTo: document.getElementById('edAssignTo').value, DueDate: dueDate };
    patchLocalTask(activeTaskId, patch);
    cancelEdit(); renderDetailView(tasks.find(t=>t.ID===activeTaskId)); render(); showToast('Saved');
    bg(apiPost({ action: 'updateTask', id: activeTaskId, title: patch.Title, description: patch.Description,
      project: patch.Project, priority: patch.Priority, assignedTo: patch.AssignedTo, dueDate, author: myName() }), 'Save failed');
  }
  async function deleteCurrentTask() {
    if (!confirm('Ye task delete karna hai? Ye undo nahi ho sakta.')) return;
    const id = activeTaskId;
    removeLocalTask(id);
    closeModal('detailOverlay'); render(); showToast('Task deleted');
    bg(apiPost({ action: 'deleteTask', id, author: myName() }), 'Delete failed');
  }

  // ============ COMMENTS ============
  function optimisticComment(taskId, comment, attachmentUrl) {
    if (!commentsCache[taskId]) commentsCache[taskId] = [];
    commentsCache[taskId].push({ Author: myName(), Comment: comment, Timestamp: new Date().toISOString(), AttachmentURL: attachmentUrl || '' });
    renderCommentsList(taskId);
  }
  function renderCommentsList(taskId) {
    if (activeTaskId !== taskId) return;
    const comments = commentsCache[taskId] || [];
    const box = document.getElementById('dComments');
    box.innerHTML = comments.length ? comments.map(c => `
      <div class="comment">
        <span class="cauthor">${escapeHtml(c.Author)}</span><span class="ctime">${fmtDate(c.Timestamp)}</span>
        <div>${escapeHtml(c.Comment)}</div>
        ${c.AttachmentURL ? `<div style="margin-top:4px;"><a href="${c.AttachmentURL}" target="_blank">📎 Link</a></div>` : ''}
      </div>`).join('') : '<div class="empty" style="padding:10px 0;">No comments yet</div>';
  }
  async function loadComments(taskId) {
    const res = await apiGet('getComments', { taskId });
    commentsCache[taskId] = res.comments || [];
    renderCommentsList(taskId);
  }
  async function submitComment() {
    const input = document.getElementById('dNewComment');
    const fileInput = document.getElementById('dCommentFile');
    const text = input.value.trim();
    if (!text) return;
    if (!myName()) { document.getElementById('nameGate').style.display = 'flex'; return; }
    const link = await uploadAttachment(fileInput, null);
    optimisticComment(activeTaskId, text, link || '');
    input.value = ''; fileInput.value = '';
    bg(apiPost({ action: 'addComment', taskId: activeTaskId, author: myName(), comment: text, attachmentUrl: link || '' }), 'Comment failed to save');
  }

  // ============ CHECKLIST ============
  function getChecklist(t) {
    try { return JSON.parse(t.Checklist || '[]'); } catch (e) { return []; }
  }
  function renderChecklist(t) {
    const items = getChecklist(t);
    const done = items.filter(i => i.done).length;
    const box = document.getElementById('dChecklist');
    box.innerHTML = `
      ${items.length ? `<div class="checklist-progress">Checklist — ${done}/${items.length} done</div>` : ''}
      ${items.map((item, i) => `
        <div class="checklist-item">
          <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleChecklistItem(${i})">
          <span class="ci-text ${item.done ? 'done' : ''}">${escapeHtml(item.text)}</span>
          <button class="ci-del" onclick="deleteChecklistItem(${i})">&times;</button>
        </div>`).join('')}
      <div class="add-checklist-item">
        <input type="text" id="newChecklistItem" placeholder="Add a checklist item..." onkeydown="if(event.key==='Enter') addChecklistItem()">
        <button class="secondary" style="background:var(--bg); color:var(--ink); border:1.5px solid var(--line);" onclick="addChecklistItem()">Add</button>
      </div>`;
  }
  function saveChecklist(id, items) {
    patchLocalTask(id, { Checklist: JSON.stringify(items) });
    bg(apiPost({ action: 'updateChecklist', id, checklist: items }), 'Checklist save failed');
  }
  function toggleChecklistItem(index) {
    const t = tasks.find(x => x.ID === activeTaskId);
    const items = getChecklist(t);
    items[index].done = !items[index].done;
    saveChecklist(activeTaskId, items);
    renderChecklist(tasks.find(x => x.ID === activeTaskId));
  }
  function deleteChecklistItem(index) {
    const t = tasks.find(x => x.ID === activeTaskId);
    const items = getChecklist(t);
    items.splice(index, 1);
    saveChecklist(activeTaskId, items);
    renderChecklist(tasks.find(x => x.ID === activeTaskId));
  }
  function addChecklistItem() {
    const input = document.getElementById('newChecklistItem');
    const text = input.value.trim();
    if (!text) return;
    const t = tasks.find(x => x.ID === activeTaskId);
    const items = getChecklist(t);
    items.push({ text, done: false });
    saveChecklist(activeTaskId, items);
    input.value = '';
    renderChecklist(tasks.find(x => x.ID === activeTaskId));
  }

  // ============ ACTIVITY FEED ============
  let activityFeed = [];
  const ACTIVITY_LABELS = {
    created: 'created', edited: 'edited', status_changed: 'changed status on', deleted: 'deleted',
    commented: 'commented on', new_job: 'created job', urgent_job: 'marked URGENT',
    approval_request: 'submitted for approval', approved: 'approved', rejected: 'rejected — redesign required',
    jobid_received: 'saved Job ID for', second_email_sent: 'sent production approval for',
    reminder_sent: 'sent a reminder for', overdue_block: 'flagged overdue block on',
    block_received: 'marked block received on', challan_uploaded: 'uploaded challan for'
  };
  async function loadActivity() {
    const res = await apiGet('getActivity');
    activityFeed = res.activity || [];
    renderActivityPanel();
    updateBellBadge();
  }
  function lastSeenActivity() {
    return localStorage.getItem('pb_last_seen_activity') || '1970-01-01T00:00:00.000Z';
  }
  function updateBellBadge() {
    const seen = new Date(lastSeenActivity());
    const unread = activityFeed.filter(a => new Date(a.Timestamp) > seen).length;
    const badge = document.getElementById('bellBadge');
    if (unread > 0) { badge.textContent = unread > 9 ? '9+' : unread; badge.style.display = 'inline-block'; }
    else { badge.style.display = 'none'; }
  }
  function renderActivityPanel() {
    const panel = document.getElementById('activityPanel');
    panel.innerHTML = `<div class="ap-head">Recent Activity</div>` + (activityFeed.length ? activityFeed.map(a => `
      <div class="activity-item">
        <div><b>${escapeHtml(a.Actor)}</b> ${ACTIVITY_LABELS[a.Action] || a.Action} <b>${escapeHtml(a.TaskTitle)}</b></div>
        ${a.Details ? `<div class="a-detail">${escapeHtml(a.Details)}</div>` : ''}
        <div class="a-time">${fmtDate(a.Timestamp)}</div>
      </div>`).join('') : `<div class="empty" style="padding:20px 0;">No activity yet</div>`);
  }
  function toggleActivityPanel() {
    const panel = document.getElementById('activityPanel');
    panel.classList.toggle('show');
    if (panel.classList.contains('show')) {
      localStorage.setItem('pb_last_seen_activity', new Date().toISOString());
      updateBellBadge();
    }
  }
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('activityPanel');
    const bell = document.getElementById('bellBtn');
    if (panel.classList.contains('show') && !panel.contains(e.target) && !bell.contains(e.target)) {
      panel.classList.remove('show');
    }
  });
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); });
  });

  // ============ FILTER LISTENERS ============
  ['filterAssignee','filterProject','filterStatus','filterStage','filterClient','filterJobId','filterDateFrom','filterDateTo'].forEach(id => document.getElementById(id).addEventListener('input', render));
  document.getElementById('searchBox').addEventListener('input', render);

  // ============ INIT ============
  initIdentity();
  loadAll();
  setInterval(loadAll, 300000); // background sync every 5 minutes — your own actions still show up instantly (optimistic)
</script>

</body>
</html>
